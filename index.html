<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited</title>
<style>
/* ===== FONTS (files live in assets/font/) ===== */
@font-face{font-family:'MiltonOne';src:url('assets/font/milton-one.one.otf') format('opentype');font-display:swap}
@font-face{font-family:'CinzelInvite';src:url('assets/font/CinzelRegular-3jEM.ttf') format('truetype');font-display:swap}
@font-face{font-family:'BodoniVenue';src:url('assets/font/Bodoni%20SvtyTwo%20ITC%20TT%20Book.ttf') format('truetype');font-display:swap}
:root{--pink:#E38496;--forest:#1A3D28;--white:#fff;--sage:#617764;--olive:#B2AF87;--cream:#F9EDD5;
--f-names:'MiltonOne',serif;--f-date:'CinzelInvite',serif;--f-venue:'BodoniVenue',serif;--fd:'MiltonOne',serif;--fb:'CinzelInvite',serif}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);color:var(--forest);font-family:var(--fb);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

/* ===== PHONE FRAME =====
   Phones: full screen (max 480px wide).
   Desktops / tablets: the invite is shown inside a phone-shaped frame.
   The frame is a size container, so every vw/vh below is written as cqw/cqh
   (relative to the frame, not the browser window). Result: identical visuals everywhere. */
.frame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,480px);height:100vh;height:100dvh;container-type:size;overflow:hidden;background:var(--cream);box-shadow:0 0 60px rgba(97,119,100,.25)}
@media (min-width:600px) and (min-height:500px){
  html,body{background:linear-gradient(160deg,#e9dfc8,#cfd6c2)}
  .frame{height:min(92vh,860px);height:min(92dvh,860px);width:min(430px,46vh);width:min(430px,46dvh);border-radius:38px;box-shadow:0 0 0 10px #1c1c1c,0 30px 80px rgba(26,61,40,.35)}
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}

/* ===== ANIMATION HELPERS ===== */
.fx{opacity:0}
.fx.l{--a:flyL}.fx.r{--a:flyR}
.scene.active:not(#s0) .fx,#nameModal.show .fx,#pop.show .fx{animation:var(--a,flyU) 1.3s cubic-bezier(.2,.8,.2,1) var(--d,.6s) both}
@keyframes flyU{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes flyL{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes flyR{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes ganpatiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ===== LOGO SCREEN ===== */
#logo{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);transition:opacity 1.2s}
#logo.gone{opacity:0;pointer-events:none}
#logoBox{width:66%;aspect-ratio:1;display:grid;place-items:center}
#logoBox img{width:100%;height:100%;object-fit:contain}
.mono{display:none;text-align:center;color:var(--pink);font-family:var(--f-names);font-size:3.4rem;line-height:1.1}
.mono small{display:block;font-size:1rem;letter-spacing:.35em;color:var(--forest);margin-top:.6rem;font-family:var(--f-date)}
#hint{margin-top:2.2rem;font-size:clamp(.9rem,3.75cqw,1.2rem);letter-spacing:.15em;text-transform:uppercase;color:var(--pink);opacity:0;animation:none;transition:opacity .8s ease}
#hint.ready{opacity:.85;animation:hintFloat 4s ease-in-out infinite}
#logoBlessings{position:absolute;bottom:3%;left:0;width:100%;display:none;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-date);font-size:clamp(11px,3.5cqw,17px);line-height:1.35;letter-spacing:.04em;text-align:center;color:var(--forest);opacity:.8;pointer-events:none}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.045)}}
#hint .inf{display:inline-block;font-size:2.565em;line-height:0;vertical-align:-.1em;margin:0 .08em}

/* ===== NAME MODAL ===== */
#nameModal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(249,237,213,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .8s}
#nameModal.show{opacity:1;pointer-events:auto}
.card{width:82%;background:var(--white);border:1px solid var(--olive);border-radius:22px;padding:2rem 1.6rem;text-align:center;box-shadow:0 18px 50px rgba(26,61,40,.18);transform:translateY(14px);transition:transform .8s}
#nameModal.show .card{transform:none}
.card h2{font-family:var(--f-names);font-weight:400;font-size:2rem;color:var(--pink)}
.card h2.welcome-word{font-family:var(--fb);letter-spacing:.06em;font-size:2.1rem}
.card p{margin:.4rem 0 1.2rem;color:var(--forest);font-family:var(--f-venue);font-size:1rem;letter-spacing:.02em}
.card input{width:100%;padding:.85rem 1rem;border:1px solid var(--olive);border-radius:12px;background:var(--cream);color:var(--forest);font:1.05rem var(--f-venue);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.card input::placeholder{color:var(--sage)}
.card input:focus{border-color:var(--pink)}
.btn{margin-top:1rem;width:100%;padding:.85rem;border:0;border-radius:12px;background:var(--pink);color:var(--white);font:.95rem var(--fb);letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== SCENES ===== */
#app{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
#app.on{opacity:1}
.scene{--hl:var(--pink);position:absolute;inset:0;background:var(--cream);transform:translateY(100%);transition:transform 1s cubic-bezier(.65,0,.25,1);overflow:hidden}
.scene.active{transform:none}
.scene.past{transform:translateY(-100%)}
.scene[data-event=mehendi],.scene[data-event=haldi]{--hl:var(--white)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s;z-index:0}
.scene.dim img.bg{opacity:.22}
.scene[data-event=main] img.bg{object-position:left center}
.scene[data-event=puja] img.bg{object-position:center top}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;background:var(--cream);color:var(--forest);font-size:.85rem;letter-spacing:.1em;z-index:1}
.ph[hidden],.image-fallback[hidden]{display:none}
.image-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;color:var(--forest);font-size:.85rem;letter-spacing:.04em;background:var(--cream);z-index:1}

/* ===== PAGE 1: BLESSING + OFFERING ===== */
/* all text is forest green; only the bride / groom / family names stay pink */
.intro{position:absolute;top:2%;left:5%;width:90%;height:96%;padding-top:0;padding-bottom:6cqh;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--forest);text-shadow:0 0 6px rgba(255,255,255,.55);pointer-events:none;overflow:visible}
.scene.active#s0 .intro{animation:flyU 1.3s .4s both}
/* Ganeshay: small, pinned to the very top of the frame */
#inviteGaneshay{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;width:clamp(58px,17cqw,82px);height:clamp(58px,17cqw,82px);object-fit:contain}
.invite-gap-small{height:1.5cqh;min-height:5px;flex-shrink:0}
.invite-hosts{
  font-family:var(--f-date);
  font-size:clamp(11px,3.5cqw,17px);
  line-height:1.2;
  letter-spacing:.035em;
  white-space:nowrap;
  width:max-content;
  max-width:100%;
  margin:0 auto 1.2cqh;
}
   .bride-side .invite-hosts{
  font-size:calc(clamp(11px,3.5cqw,17px) + 3px);
}
.invite-statements,.invite-statement{font:clamp(12px,3.4cqw,16px)/1.2 var(--f-venue);letter-spacing:.01em}
.invite-opening{margin-bottom:1.2cqh}
.invite-opening p{margin:0}
.invite-with{font:clamp(12px,3.4cqw,16px)/1.2 var(--f-venue);margin:.6cqh 0;position:relative;top:-1.5cqh}
.invite-groom{margin-bottom:-.8cqh;transform:translateX(8cqw)}
h1.invite-name{transform:translateX(-8cqw)}

/* Groom main page: keep the bride-side layout, with names slightly separated */
.groom-side h1.invite-name{transform:translate(-15cqw,1.2cqh)}
.groom-side .invite-with{transform:translateY(.5cqh)}
.groom-side .invite-groom{transform:translate(15cqw,calc(1.2cqh - 12px))}
.groom-side .invite-groom ~ .invite-statement,
.groom-side .invite-groom ~ .invite-gap-small,
.groom-side .invite-groom ~ .invite-family{transform:translateY(-12px)}
.groom-side .invite-family{position:relative;top:-4px}
.invite-statement{margin:0 0 .7cqh;max-width:100%}
/* names: pink, 0.5px stroke */
.invite-name{font:500 clamp(70px,20cqw,96px)/1.05 var(--f-names);color:var(--pink);-webkit-text-stroke:.5px var(--pink);text-shadow:0 2px 8px rgba(26,61,40,.45);overflow-wrap:anywhere;margin:0}
.invite-family{font:500 clamp(36px,10.5cqw,50px)/1.1 var(--f-names);color:var(--pink);-webkit-text-stroke:.5px var(--pink);text-shadow:0 2px 8px rgba(26,61,40,.45);margin-top:0;overflow-wrap:anywhere}
#hintG{position:absolute;bottom:max(1.1rem,env(safe-area-inset-bottom));left:5%;width:90%;z-index:3;text-align:center;white-space:normal;opacity:0;pointer-events:none;font-family:var(--fb);font-size:clamp(.855rem,3.56cqw,1.14rem);letter-spacing:.08em;color:var(--forest);text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.9),0 0 28px rgba(255,255,255,.6)}
#hintG.show{   animation:petalFadeIn 1.2s ease-out both,              hintPromptPulse 2.2s 1.2s ease-in-out infinite; }  @keyframes hintPromptPulse{   0%,100%{     opacity:.85;     text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.9),0 0 24px rgba(255,255,255,.65);   }   50%{     opacity:1;     text-shadow:0 0 10px #fff,0 0 22px rgba(255,244,191,1),0 0 36px rgba(255,239,175,.95);   } }
.offer-sparkle{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff4bf;box-shadow:0 0 5px 2px rgba(255,239,175,.8);pointer-events:none;z-index:101;animation:offerSparkle 1.25s ease-out forwards}
@keyframes offerSparkle{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1)}}
#drop{position:absolute;left:50%;bottom:calc(7% - 39px);width:78px;height:78px;margin-left:-39px;border-radius:50%;border:1.5px dashed var(--white);box-shadow:0 0 20px rgba(255,255,255,.45),inset 0 0 18px rgba(227,132,150,.38);animation:pulse 2.6s infinite;z-index:6}
.tree-art{position:absolute;right:-31%;bottom:0;width:72.5%;height:65%;z-index:5;pointer-events:none;overflow:visible;transform-origin:80% 100%}
.tree-art img,.tree-art svg.t{width:100%;height:100%}
.tree-art img{object-fit:contain;object-position:bottom right}
.scene.active#s0 .tree-art{animation:treeEnter 1.8s cubic-bezier(.2,.75,.25,1) both,treeBobble 16s 1.8s ease-in-out infinite}
@keyframes treeEnter{from{opacity:0;transform:translateX(65%) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes treeBobble{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-2.4deg)}55%{transform:translateX(6px) rotate(1.8deg)}75%{transform:translateX(-5px) rotate(-1.2deg)}}
.flower{position:absolute;width:44.1px;height:44.1px;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scaleX(var(--flip,1));cursor:grab;touch-action:none;z-index:7;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35));transition:transform .35s,opacity .5s;pointer-events:auto}
.flower.drag{transition:none;cursor:grabbing;z-index:30}
.flower img,.flower svg{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}

/* ===== GANPATI + FLOWER (one element shared by pages 1 and 2) =====
   Moves with transforms and the SAME easing/duration as the scenes, so it glides
   with the background. On leaving page 2 it exits upward in sync with the slide
   (no fade-out). Geometry: page 1 = top 49% / height 49%; page 2 = top 8% / height 46%. */
#bappa{position:absolute;left:17%;width:66%;top:49%;height:49%;z-index:4;pointer-events:none;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.65,0,.25,1);will-change:transform}
#bappa.up{transform:translateY(-44cqh) scale(.939)}
#bappa.gone{transform:translateY(-144cqh) scale(.939)}
#bappa img.bgan{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;opacity:0;filter:drop-shadow(0 5px 10px rgba(26,61,40,.12))}
#bappa.in img.bgan{animation:flyU 1.5s .5s cubic-bezier(.2,.8,.2,1) both,ganpatiFloat 4.5s 2s ease-in-out infinite}
.bappa-flower{position:absolute;left:50%;bottom:3%;width:61.6px;height:61.6px;transform:translateX(-50%);opacity:0;transition:opacity .5s;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35))}
.bappa-flower img,.bappa-flower svg{width:100%;height:100%;object-fit:contain;display:block}
#bappa.offered .bappa-flower{opacity:1;transform:translateX(-50%) rotate(45deg);animation:flowerSpin 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes flowerSpin{from{transform:translateX(-50%) rotate(-315deg) scale(.6)}to{transform:translateX(-50%) rotate(45deg) scale(1)}}

/* ===== SAGAI CONSTELLATION (glimmering wish stars) ===== */
.constellation-layer{position:absolute;inset:0;z-index:20;overflow:hidden;pointer-events:none}
.constellation-heading{position:absolute;top:6%;left:8%;width:84%;text-align:center;color:#fff;font:600 1.05rem/1.4 var(--f-date);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 12px rgba(255,255,255,.7);pointer-events:none}
/* the button is a 34px tap target; the visible sparkle is 10px */
.constellation-star{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;background:transparent;color:#fff8e9;cursor:pointer;pointer-events:auto;touch-action:manipulation;z-index:21;--lo:.3;--hi:1;filter:drop-shadow(0 0 3px rgba(255,248,223,.85));animation:starGlimmer var(--twinkle,2.8s) ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.constellation-star svg{display:block;width:calc(10px*var(--big,1));height:calc(10px*var(--big,1));overflow:visible;pointer-events:none}
.constellation-star .star-shape{fill:currentColor}
.constellation-star.is-dim{--lo:.12;--hi:.55}
@keyframes starGlimmer{0%,100%{opacity:var(--lo);scale:.7}50%{opacity:var(--hi);scale:1.2}}
.constellation-star::after{content:attr(data-category);position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%);padding:.3rem .55rem;border-radius:20px;background:rgba(20,38,32,.9);color:#fff;font:.58rem var(--f-date);letter-spacing:.08em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.constellation-star:hover::after,.constellation-star:focus-visible::after{opacity:1}
.constellation-star:focus-visible{outline:1px solid #fff;border-radius:50%}
.constellation-star.is-gold{color:#ffd66f;filter:drop-shadow(0 0 3px #fff7d7) drop-shadow(0 0 8px #ffce68) drop-shadow(0 0 17px rgba(255,190,74,.92))}
.constellation-star.is-mine{--lo:.85;--hi:1;color:#ffda78;filter:drop-shadow(0 0 5px #fff7d7) drop-shadow(0 0 13px #ffce68) drop-shadow(0 0 24px rgba(255,190,74,1))}
.constellation-star.is-taken:not(.is-mine){animation:none;opacity:.5;scale:1;color:#ffd66f;filter:drop-shadow(0 0 3px rgba(255,214,111,.9)) drop-shadow(0 0 8px rgba(255,190,74,.6))} 
.constellation-ui{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:1.2rem;background:rgba(12,28,23,.56);opacity:0;pointer-events:none;transition:opacity .25s}
.constellation-ui.open{opacity:1;pointer-events:auto}
.constellation-card{width:min(100%,350px);max-height:82%;overflow:auto;padding:1.5rem 1.25rem;border:1px solid #d8c28a;border-radius:20px;background:#fffaf0;color:var(--forest);text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.3);user-select:text;-webkit-user-select:text}
.constellation-card h3{font:700 1.45rem/1.25 var(--f-names);color:var(--pink);margin-bottom:.45rem}
.constellation-card .star-category{font:700 1rem/1.4 var(--f-date);letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin-bottom:.8rem}
.constellation-card .star-fortune{font:700 1.2rem/1.5 var(--f-venue);margin-bottom:1rem}
.constellation-card textarea{display:block;width:100%;min-height:90px;resize:vertical;border:1px solid var(--olive);border-radius:12px;background:#fff;color:var(--forest);padding:.8rem;font:1rem/1.4 var(--f-venue);outline:none}
.constellation-card textarea:focus{border-color:var(--pink)}
.constellation-actions{display:flex;gap:.6rem;margin-top:.8rem}
.constellation-actions button{flex:1;padding:.75rem .45rem;border:0;border-radius:10px;font:.68rem var(--f-date);letter-spacing:.04em;cursor:pointer}
.constellation-seal{background:var(--pink);color:#fff}.constellation-cancel{background:#e9e4d8;color:var(--forest)}
.constellation-status{min-height:1.3em;margin-top:.75rem;font:.8rem/1.4 var(--f-venue);color:var(--sage)}
.constellation-admin{position:absolute;right:.7rem;top:.7rem;z-index:32;padding:.4rem .55rem;border:1px solid rgba(255,255,255,.6);border-radius:8px;background:rgba(12,28,23,.75);color:#fff;font:.55rem var(--f-date);letter-spacing:.04em;pointer-events:auto}
.constellation-admin-panel{position:absolute;inset:0;z-index:35;padding:1rem;background:rgba(10,24,19,.94);color:#fff;overflow:auto;pointer-events:auto;display:none}
.constellation-admin-panel.open{display:block}.constellation-admin-panel h3{font:1.4rem var(--f-names);margin:1rem 0}.admin-wish{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.2);font:.8rem/1.4 var(--f-venue);overflow-wrap:anywhere}.admin-wish button{margin:.4rem .3rem 0 0;padding:.35rem .5rem;border:0;border-radius:6px;background:#d7b45a;color:#17271e;font-size:.7rem}.admin-close{position:sticky;top:0;float:right;padding:.45rem .65rem;border:0;border-radius:8px}

/* ===== EVENT PAGES ===== */
.ev-over{position:absolute;left:0;right:0;bottom:10%;top:auto;padding:0 .8rem 2.2rem;text-align:center;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(26,61,40,.3)}
.ev-over .tg{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--white)}
.ev-over h2,.ev-over p{font-weight:500;-webkit-text-stroke:.3px currentColor}
.ev-over h2{font-family:var(--f-names);font-weight:500;font-size:clamp(3.5rem,15cqw,4.9rem);line-height:.95;color:var(--hl);margin:.2rem 0 .5rem;overflow-wrap:anywhere} html[data-side=groom] .scene[data-event=puja] .ev-over h2{   font-size:calc(clamp(3.5rem,15cqw,4.9rem) - 3px); }
.bride-side .scene[data-event=mehendi] .ev-over h2,
.bride-side .scene[data-event=haldi] .ev-over h2{
  font-size:clamp(4.1rem,17.5cqw,5.7rem);
  line-height:1;
}
/* Sangeet title is intentionally large on both sides */
.bride-side .scene[data-event=sangeet] .ev-over h2,
.groom-side .scene[data-event=sangeet] .ev-over h2{
  font-size:clamp(4.6rem,20cqw,6.4rem);
  line-height:1;
}
   .ev-over p{color:var(--white);font-size:1rem;margin:.18rem 0}
.date-time,.host-names{font-family:var(--f-date)}
.venue-row{font-family:var(--f-venue)}

.loading-dots{
  display:inline-block;
  font-weight:700;
  letter-spacing:.12em;
  background:linear-gradient(
    90deg,
    #E38496 0%,
    #B2AF87 45%,
    #1A3D28 100%
  );
  background-size:200% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:dotShimmer 1.1s linear infinite;
}

@keyframes dotShimmer{
  from{background-position:100% 0}
  to{background-position:-100% 0}
}

   .maplink{display:inline-block;margin-top:.9rem;padding:.55rem 1.3rem;border:1px solid currentColor;border-radius:999px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;pointer-events:auto;cursor:pointer}
.ev-over .maplink{color:var(--white)}
.scene[data-event=puja] .ev-over p,.scene[data-event=puja] .ev-over .maplink{color:var(--sage);text-shadow:0 1px 4px rgba(249,237,213,.55)}
.scene[data-event=puja] .ev-over h2{font-size:clamp(3.5rem,15cqw,4.9rem)}
/* Groom GPUJA uses the puja skin; keep every visible event detail white. */
.groom-side .scene[data-event=puja] .ev-over,
.groom-side .scene[data-event=puja] .ev-over h2,
.groom-side .scene[data-event=puja] .ev-over p,
.groom-side .scene[data-event=puja] .ev-over .maplink{color:#fff!important;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.groom-side .scene[data-event=puja] .ev-over{top:16%;bottom:auto;padding:0 .8rem;text-align:center}

.groom-side .scene[data-event=puja] .ev-over h2{
  font-size:calc(clamp(3.6rem,16cqw,5.4rem) - 3px);
  line-height:1.02;
}

function tone(f,t0,dur,vol){

  document.body.appendChild(c);f.style.opacity=0;
  const a=c.animate([
    {transform:'translate(0,0) rotate(0deg) scale(1.1)'},
    {transform:`translate(${dx*.45}px,${dy*.45-80}px) rotate(170deg) scale(1.5)`,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(45deg) scale(${t.width/r.width})`}
  ],{duration:1000,easing:'cubic-bezier(.35,.7,.3,1)',fill:'forwards'});
  const trail=setInterval(()=>{const b=c.getBoundingClientRect();dust(b.left+b.width/2,b.top+b.height/2,{n:3,spread:1.4})},40);
  a.onfinish=()=>{
    clearInterval(trail);c.remove();
    $('#bappa').classList.add('offered');
    burst(ex,ey,50,{spread:4});chime();buzz(15);
    setTimeout(()=>go(1),500);
  };
}

/* turmeric splash wipe: grows from the tap point, then fades to reveal the page */
function turmericSplash(){
  const r=frameEl.getBoundingClientRect(),x=lastTap.x-r.left,y=lastTap.y-r.top;
  const w=document.createElement('div');w.className='splash';w.style.cssText=`--x:${x}px;--y:${y}px`;
  const fill=document.createElement('div');fill.className='splash-fill';w.appendChild(fill);
  frameEl.appendChild(w);
  fill.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(${Math.hypot(r.width,r.height)}px at ${x}px ${y}px)`}],{duration:650,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'});
  for(let i=0;i<60;i++){
    const b=document.createElement('div'),sz=rnd(2,6),ang=rnd(0,6.283),d=rnd(60,320);
    b.className='splash-blob';b.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px`;w.appendChild(b);
    b.animate([
      {transform:'translate(-50%,-50%) scale(.2)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*d}px),calc(-50% + ${Math.sin(ang)*d}px)) scale(1)`,opacity:1,offset:.75},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*d*1.1}px),calc(-50% + ${Math.sin(ang)*d*1.1+20}px)) scale(.9)`,opacity:0}
    ],{duration:850,easing:'ease-out',fill:'forwards'});
  }
  setTimeout(()=>{w.animate([{opacity:1},{opacity:0}],{duration:800,fill:'forwards'}).onfinish=()=>w.remove()},750);
}

/* ambient effects per page: turmeric drips (haldi / gpuja), shooting stars (sangeet) */
let ambientTimer=null;
function stopAmbient(){clearTimeout(ambientTimer);ambientTimer=null}
function startAmbient(scene){
  stopAmbient();
  const k=scene&&scene.dataset.key;
  const kind=k==='sangeet'?'shoot':null;
  if(!kind)return;
  const tick=()=>{
    if(scenes[cur]!==scene)return;
    if(kind==='drip'){
      const d=document.createElement('div');d.className='drip';
      d.style.cssText=`--x:${rnd(6,94)}%;--w:${rnd(5,9).toFixed(1)}px;--len:${rnd(60,130).toFixed(0)}px`;
      scene.appendChild(d);d.addEventListener('animationend',()=>d.remove());
    }else{
      const st=document.createElement('div');st.className='shoot';
      st.style.cssText=`left:${rnd(-5,45).toFixed(1)}%;top:${rnd(3,38).toFixed(1)}%;--len:${rnd(90,150).toFixed(0)}px`;
      scene.appendChild(st);st.addEventListener('animationend',()=>st.remove()); {const sr=scene.getBoundingClientRect(),len=parseFloat(st.style.getPropertyValue('--len')),  x0=sr.left+parseFloat(st.style.left)/100*sr.width,y0=sr.top+parseFloat(st.style.top)/100*sr.height,  ca=Math.cos(.4363),sa=Math.sin(.4363);let t=0;  const tr=setInterval(()=>{t+=33;const p=Math.min(t/1100,1),d=len+300*p*p;   dust(x0+d*ca,y0+d*sa,{n:4,tiny:true,spread:1.4});   if(p>=1)clearInterval(tr)},33)}
    }
    ambientTimer=setTimeout(tick,kind==='drip'?rnd(2500,5500):rnd(5000,9000));
  };
  ambientTimer=setTimeout(tick,kind==='drip'?1800:rnd(2500,5000));
}

/* ---- navigation ---- */
function show(i){
  cur=i;

  const activeBg=scenes[i]?.querySelector('img.bg[data-src]');
  if(activeBg){
    activeBg.src=activeBg.dataset.src;
    activeBg.removeAttribute('data-src');
  }

  const bp=$('#bappa');
const bi=scenes.findIndex(x=>x.dataset.bappa==='1');
  const hasUp=bi>0;
  bp.classList.toggle('up',hasUp&&i>=1);
  bp.classList.toggle('fromMain',!hasUp);
  bp.classList.toggle('gone',i>Math.max(bi,0));
  if(i===0)bp.classList.remove('offered');

  if(i===PETAL&&!filled){filled=true;for(let k=0;k<26;k++)makePetal(true)}

  clearTimeout(ps._hintTimer);
  if(i===PETAL){
    const hint=ps.querySelector('.petal-hint');
    hint.classList.remove('show');
    ps._hintTimer=setTimeout(()=>{if(cur===PETAL&&!popOpen)hint.classList.add('show')},2000);
  }

  scenes.forEach((s,j)=>{s.className='scene'+(j<i?' past':j==i?' active':'')+(j===PETAL&&popOpen?' dim':'')});

  if(i===0){
    const hint=$('#hintG');

    if(introPromptShown){
      hint.classList.add('show');

      if(!introTrailTimer){
        offeringPixieDust();
        introTrailTimer=setInterval(offeringPixieDust,2600);
      }
    }else if(!introTimer){
      introTimer=setTimeout(()=>{
        if(cur===0){
          hint.classList.add('show');
          introPromptShown=true;
          offeringPixieDust();

          if(!introTrailTimer){
            introTrailTimer=setInterval(offeringPixieDust,2600);
          }
        }
        introTimer=null;
      },5000);
    }
  }else{
    if(introTimer){
      clearTimeout(introTimer);
      introTimer=null;
    }

    if(introTrailTimer){
      clearInterval(introTrailTimer);
      introTrailTimer=null;
    }
  }
  stopAmbient();startAmbient(scenes[i]);
}
function go(i){
  if(i<0||i>FINAL||popOpen)return;
  if(i===0){locked=false;scenes[0].querySelectorAll('.flower').forEach(f=>{f.style.transform='';f.style.opacity=1})}
  if(i>cur&&['haldi','gpuja'].includes(scenes[i]&&scenes[i].dataset.key))turmericSplash();
  show(i);
}

/* ---- name entry ---- */
let guestEvents=[],guestDisplay='',checking=false,nameNeedsFull=false;
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
/* local test list: used only while GUEST_SOURCE === "local" */
const TEST_GUESTS={
  bride:{"priya shah":{name:"Priya Shah",display:"Priya",events:["puja","mehendi","sangeet","haldi","wedding"]},
         "rahul mehta":{name:"Rahul Mehta",display:"Rahul",events:["puja","sangeet","wedding"]}},
  groom:{"amit verma":{name:"Amit Verma",display:"Amit",events:["sangeet","gpuja","wedding"]}}
};
/* ---- guest lookup: warm-up ping + cache ---- */
const GL_KEY='guestCache.'+SIDE;
const glCache=(()=>{try{return JSON.parse(localStorage.getItem(GL_KEY)||'{}')}catch(e){return{}}})();
window.__ping=()=>{};
if(GUEST_SOURCE!=='local'){
  const w=document.createElement('script');
  w.src=CONSTELLATION_API+'?action=ping&callback=__ping&_='+Date.now();
  w.onload=w.onerror=()=>w.remove();
  document.head.appendChild(w);
}
function findGuest(name){
  if(GUEST_SOURCE==='local')return fetchGuest(name);
  const key=normName(name);
  const lookup=fetchGuest(name).then(d=>{
    if(d&&d.ok){glCache[key]=d;try{localStorage.setItem(GL_KEY,JSON.stringify(glCache))}catch(e){}}
    return d;
  });
  /* repeat visitors: answer instantly, refresh in the background */
  return glCache[key]?(lookup.catch(()=>{}),Promise.resolve(glCache[key])):lookup;
}
function fetchGuest(name){
  if(GUEST_SOURCE==='local'){
    const g=(TEST_GUESTS[SIDE]||{})[normName(name)];
    return Promise.resolve(g?{ok:true,...g}:{ok:false,error:'not_found'});
  }
  return new Promise((res,rej)=>{
    const cb='cb'+Date.now(),sc=document.createElement('script');
    const done=()=>{clearTimeout(t);delete window[cb];sc.remove()};
    const t=setTimeout(()=>{done();rej(new Error('timeout'))},8000);
    window[cb]=d=>{done();res(d)};
    sc.onerror=()=>{done();rej(new Error('network'))};
    sc.src=CONSTELLATION_API+'?action=guest&side='+SIDE+'&name='+encodeURIComponent(name)+'&callback='+cb+'&_ts='+Date.now();
    document.head.appendChild(sc);
  });
}
function nameError(msg){
  const c=$('#nameModal .card');
  c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  let err=$('#guestError');
  if(!err){err=document.createElement('p');err.id='guestError';err.style.cssText='color:#B34D62;font-size:.85rem;margin-top:.8rem';$('#nameIn').insertAdjacentElement('afterend',err)}
  err.textContent=msg;
}

async function submitName(){
  if(checking)return;

  const v=$('#nameIn').value.trim().replace(/\s+/g,' ');
  const parts=v.split(' ').filter(Boolean);

  if(!v)return nameError('Please enter your first name.');
  if(!nameNeedsFull&&parts.length!==1)
    return nameError('Please enter your first name only.');
  if(nameNeedsFull&&parts.length<2)
    return nameError('Please enter your first and last name.');

  checking=true;
  $('#enterBtn').innerHTML='Checking <span class="loading-dots">...</span>';

  let d;
  try{
    d=await findGuest(v);
  }catch(e){
    d={ok:false,error:'network'};
  }

  checking=false;
  $('#enterBtn').textContent='Enter';

  if(!d.ok){
    if(d.error==='duplicate'&&!nameNeedsFull){
      nameNeedsFull=true;
      $('#nameIn').placeholder='Enter first and last name';
      return nameError(
        'We found more than one guest with that first name. Please enter your first and last name.'
      );
    }

    const m={
      network:'Could not check the guest list. Please try again.',
      duplicate:'This name needs a quick manual check. Please contact the family.',
      config:'The guest list is not configured correctly. Please contact the family.'
    };

    return nameError(
      m[d.error]||
      'We couldn’t find your invitation. Please check the spelling.'
    );
  }

  nameNeedsFull=false;
  const err=$('#guestError');
  if(err)err.remove();

  guest=d.name;
  guestDisplay=d.display||d.name.split(' ')[0];
  guestEvents=d.events||[];

  $('#nameIn').blur();
  build();
  $('#nameModal').classList.remove('show');
  $('#logo').classList.add('gone');
  stage='scenes';
  app.classList.add('on');
  show(0);
  $('#bappa').classList.add('in');
}
$('#enterBtn').onclick=submitName;
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitName()});
['pointerdown','pointerup'].forEach(ev=>$('#nameModal').addEventListener(ev,e=>e.stopPropagation()));

/* ---- flower drag (page 1) ---- */
function wireFlower(f){
  let sx,sy,tx=0,ty=0;
  const T=sc=>`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(var(--rot,0deg)) scaleX(var(--flip,1)) scale(${sc})`;
  f.addEventListener('pointerdown',e=>{if(locked)return;e.stopPropagation();tx=ty=0;f.style.transform='';f.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;f.classList.add('drag')});
  f.addEventListener('pointermove',e=>{if(!f.classList.contains('drag'))return;tx=e.clientX-sx;ty=e.clientY-sy;f.style.transform=T(1.25);dust(e.clientX,e.clientY,{n:2,faint:true})});
  f.addEventListener('pointerup',e=>{
    e.stopPropagation();
    if(!f.classList.contains('drag'))return;
    f.classList.remove('drag');
    const d=$('#drop').getBoundingClientRect(),dx=d.left+d.width/2,dy=d.top+d.height/2;
    if(Math.hypot(e.clientX-dx,e.clientY-dy)<d.width*.8&&!locked){
      locked=true;
      const r=f.getBoundingClientRect();
      tx+=dx-(r.left+r.width/2);ty+=dy-(r.top+r.height/2);
      f.style.transform=T(1);
      burst(dx,dy,90,{spread:5});
      setTimeout(()=>{f.style.opacity=0;$('#bappa').classList.add('offered');go(1);chime();buzz(15)},750);
    }else{tx=ty=0;f.style.transform=''}
  });
}

/* ---- petals (wedding page) ---- */
function makePetal(pre){
  const dur=rnd(9,17),sz=rnd(24,52),hit=Math.max(sz+26,64),p=document.createElement('div'),pi=document.createElement('span');
  p.className='petal';
  p.style.cssText=`width:${hit}px;height:${hit}px;left:calc(${rnd(-4,96)}% - ${hit/2}px);animation-duration:${dur}s;animation-delay:${pre?-rnd(0,dur*.9).toFixed(2):0}s;--dx:${rnd(-140,140)}px;--dx2:${rnd(-110,110)}px;--spin:${rnd(-540,540)}deg`;
  pi.className='pi';
  pi.style.cssText=`--s:${sz}px;--td:${rnd(2.4,5)}s;--sw:${rnd(8,30)}px;--r0:${rnd(-70,0)}deg;--r1:${rnd(0,70)}deg;--rx:${rnd(-75,75)}deg;--ry:${rnd(-75,75)}deg;--fl:${Math.random()<.5?-1:1};--o:${rnd(.42,1).toFixed(2)}`;
  const im=new Image();
  im.src=CONFIG.petal;im.draggable=false;im.alt='';
  im.onerror=()=>{im.remove();pi.classList.add('fb')};
  pi.appendChild(im);p.appendChild(pi);
  p.addEventListener('animationend',e=>{if(e.target===p)p.remove()});
  p.addEventListener('pointerdown',e=>e.stopPropagation());
  p.addEventListener('pointerup',e=>{
    e.stopPropagation();
    const r=p.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,22,{spread:2.5});
    const pr=pi.getBoundingClientRect(),pc=pi.cloneNode(true);p.remove();buzz(15);openPop();flyPetalToCard(pr,pc);
  });
  ps.appendChild(p);
}
function spawnPetal(){
  if(ps&&cur===PETAL&&!popOpen&&ps.querySelectorAll('.petal').length<34)makePetal(false);
  setTimeout(spawnPetal,rnd(250,600));
}
spawnPetal();

function flyPetalToCard(pr,pc){   const card=$('#popCard'),orn=document.createElement('div');   orn.className='pop-orn';orn.style.opacity=0;card.appendChild(orn);   requestAnimationFrame(()=>{     const t=orn.getBoundingClientRect(),sz=Math.max(pr.width,24),       sx=pr.left+pr.width/2,sy=pr.top+pr.height/2,dx=t.left+t.width/2-sx,dy=t.top+t.height/2-sy;     pc.style.animation='none';pc.style.width='100%';pc.style.height='100%';pc.style.transform='none';     const c=document.createElement('div');c.className='petal-fly';     c.style.cssText=`left:${sx-sz/2}px;top:${sy-sz/2}px;width:${sz}px;height:${sz}px`;     c.appendChild(pc);document.body.appendChild(c);     const trail=setInterval(()=>{const b=c.getBoundingClientRect();dust(b.left+b.width/2,b.top+b.height/2,{n:2,tiny:true})},40);     c.animate([       {transform:'translate(0,0) rotate(0deg) scale(1)'},       {transform:`translate(${dx*.5}px,${dy*.5-30}px) rotate(120deg) scale(1.2)`,offset:.5},       {transform:`translate(${dx}px,${dy}px) rotate(-20deg) scale(${t.width/sz})`}     ],{duration:900,easing:'cubic-bezier(.35,.7,.3,1)',fill:'forwards'}).onfinish=()=>{       clearInterval(trail);orn.appendChild(pc);c.remove();orn.style.opacity=1;       burst(t.left+t.width/2,t.top+t.height/2,20,{spread:2});     };   }); } function openPop(){
  /* a falling petal always reveals the wedding details */
  const e=EVENTS.wedding,row=(cls,v)=>v?`<div class="row ${cls}">${v}</div>`:'';
  $('#popCard').innerHTML=`<h2 class="fx" style="--d:.1s">${e.title}</h2>${row('date-time fx l',e.date)}${row('date-time fx r',e.time)}${row('venue-row fx l',e.venue)}${row('host-names fx r',e.hosts&&'Hosted by '+e.hosts)}${mapLink(e,1.1)}`;
  popOpen=true;$('#pop').classList.add('show');ps.classList.add('dim');
}
function closePop(){popOpen=false;$('#pop').classList.remove('show');if(ps)ps.classList.remove('dim')}

/* ---- last page → logo: the small logo grows and glides to the centre ---- */
function returnToInfinity(){
  const fl=$('#final .lg'),logo=$('#logo'),box=$('#logoBox'),hint=$('#hint'),fin=$('#final');

  hint.classList.remove('ready');
   logoBlessings.style.display='none';

  if(!fl||fl.style.display==='none'){
    logo.classList.remove('gone');
    app.classList.remove('on');
    stage='logo';cur=0;drawing=false;pts=[];
     logoBlessings.style.display='none';
    setTimeout(()=>{if(stage==='logo')hint.classList.add('ready')},2000);
    return;
  }

  stage='returning';

  const start=fl.getBoundingClientRect();
  const clone=fl.cloneNode(true);
  clone.className='logo-return';
  clone.style.cssText=`left:${start.left}px;top:${start.top}px;width:${start.width}px;height:${start.height}px;opacity:1`;
  document.body.appendChild(clone);

  fl.style.visibility='hidden';
  box.style.visibility='hidden';
  hint.style.visibility='hidden';

  fin.style.transition='opacity .6s';
  fin.style.opacity='0';

  logo.classList.remove('gone');

  const target=box.getBoundingClientRect();

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    clone.style.left=target.left+'px';
    clone.style.top=target.top+'px';
    clone.style.width=target.width+'px';
    clone.style.height=target.height+'px';
  }));

  setTimeout(()=>{
    clone.remove();

    fl.style.visibility='';
    box.style.visibility='';
    hint.style.visibility='';
    fin.style.opacity='';
    fin.style.transition='';

    app.classList.remove('on');
    $('#nameModal').classList.remove('show');

    stage='logo';cur=0;drawing=false;pts=[];
logoBlessings.style.display='none';
    setTimeout(()=>{
      if(stage==='logo')hint.classList.add('ready');
    },2000);
  },1000);
}

/* ---- global pointer handling (ignores anything outside the phone frame) ---- */
addEventListener('pointerdown',e=>{
  down=null;
  if(!inFrame(e))return;
  down={x:e.clientX,y:e.clientY};
  if(stage==='logo'){drawing=true;pts=[{x:e.clientX,y:e.clientY}];dust(e.clientX,e.clientY,{n:4,tiny:true})}
});
addEventListener('pointermove',e=>{
  if(stage==='logo'&&drawing){
    const l=pts[pts.length-1];
    if(Math.hypot(e.clientX-l.x,e.clientY-l.y)>=6){
      pts.push({x:e.clientX,y:e.clientY});
      if(pts.length%6===0&&isInfinity()){infinityDone();return}
    }
    dust(e.clientX,e.clientY,{n:2,tiny:true,spread:.6});
  }else if(stage==='scenes'&&inFrame(e)&&(e.buttons||e.pointerType==='mouse')&&!e.target.closest('.flower'))dust(e.clientX,e.clientY,{n:1,faint:true,spread:.7});
});
addEventListener('pointerup',e=>{
  if(stage==='logo'){
    if(!drawing){pts=[];return}
    drawing=false;burst(e.clientX,e.clientY,10,{tiny:true,spread:1.5});if(isInfinity())infinityDone();pts=[];return;
  }
  if(stage!=='scenes'||!down)return;
  const start=down;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  const moved=Math.hypot(dx,dy);
  down=null;
  const blocked=e.target.closest('.flower,.petal,#nameModal,a,button,input,textarea,.constellation-star,.constellation-ui,.constellation-admin,.constellation-admin-panel');
  if(!inFrame(e)||blocked)return;

  // Remind guests to offer a flower if they try to swipe past the opening page.
  if(moved>12){
    if(cur===0&&dx< -12&&!e.target.closest('.flower')){
      const hint=$('#hintG');
      hint.classList.remove('show');
      void hint.offsetWidth;
      hint.classList.add('show');
      introPromptShown=true;
    }
    return;
  }

  if(e.target.closest('.flower,.petal'))return;
  if(popOpen){closePop();go(FINAL);return}

  const r=frameEl.getBoundingClientRect(),tapX=(e.clientX-r.left)/r.width;

  if(cur===FINAL&&(tapX>=.75||e.target.closest('.lg'))){returnToInfinity();return}   /* last page: right side → logo */

  if(tapX<.25){dust(e.clientX,e.clientY,{n:16,faint:true,spread:2.5});go(cur-1);return}   /* left edge: back */

  if(cur===PETAL){   /* petal page: a tap pulses the prompt text */
    const hint=ps.querySelector('.petal-hint');
    if(hint.classList.contains('show')){
      const t=hint.firstElementChild;
      t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse');
    }
    return;
  }

  if(cur>=1&&cur<PETAL)go(cur+1);   /* event pages: advance */
});
