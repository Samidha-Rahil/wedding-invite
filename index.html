<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited</title>
<link rel="preload" href="assets/font/milton-one.one.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/font/CinzelRegular-3jEM.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/font/Bodoni%20SvtyTwo%20ITC%20TT%20Book.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* ===== FONTS ===== */
@font-face{font-family:'MiltonOne';src:url('assets/font/milton-one.one.otf') format('opentype');font-display:block}
@font-face{font-family:'CinzelInvite';src:url('assets/font/CinzelRegular-3jEM.ttf') format('truetype');font-display:block}
@font-face{font-family:'BodoniVenue';src:url('assets/font/Bodoni%20SvtyTwo%20ITC%20TT%20Book.ttf') format('truetype');font-display:block}
:root{--fw:min(100vw,calc(100dvh*1080/2412*1.07));font-size:calc(var(--fw)/26.9);--pink:#E38496;--forest:#1A3D28;--white:#fff;--sage:#617764;--olive:#B2AF87;--cream:#F9EDD5;
--f-names:'MiltonOne',serif;--f-date:'CinzelInvite',serif;--f-venue:'BodoniVenue',serif;--fd:'MiltonOne',serif;--fb:'CinzelInvite',serif}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);color:var(--forest);font-family:var(--fb);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

/* ===== PHONE FRAME (size container: all cqw/cqh are relative to it) ===== */
.frame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--fw);height:calc(var(--fw)*2412/1080);container-type:size;overflow:hidden;background:var(--cream);box-shadow:0 0 60px rgba(97,119,100,.25)}
@media (min-width:600px) and (min-height:500px){
  html,body{background:linear-gradient(160deg,#e9dfc8,#cfd6c2)}
  :root{--fw:calc(min(92dvh,860px)*1180/2412)}
  .frame{border-radius:38px;box-shadow:0 0 0 10px #1c1c1c,0 30px 80px rgba(26,61,40,.35)}
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}

/* ===== ANIMATION HELPERS ===== */
.fx{opacity:0}
.fx.l{--a:flyL}.fx.r{--a:flyR}
.scene.active:not(#s0) .fx,#nameModal.show .fx,#pop.show .fx{animation:var(--a,flyU) 1.3s cubic-bezier(.2,.8,.2,1) var(--d,.6s) both}
/* while a page is leaving, keep its text visible so it travels with the transition */
.scene.hide .fx{opacity:1;animation:none}
@keyframes flyU{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes flyL{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes flyR{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes ganpatiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ===== LOGO SCREEN ===== */
#logo{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream) url('assets/bg-logo.jpg') center/cover no-repeat;transition:opacity 1.2s}
#logo.gone{opacity:0;pointer-events:none}
#logoBox{width:66%;aspect-ratio:1;display:grid;place-items:center}
#logoBox img{width:100%;height:100%;object-fit:contain}
.mono{display:none;text-align:center;color:var(--pink);font-family:var(--f-names);font-size:3.4rem;line-height:1.1}
.mono small{display:block;font-size:1rem;letter-spacing:.35em;color:var(--forest);margin-top:.6rem;font-family:var(--f-date)}
#hint{margin-top:2.2rem;font-size:clamp(.9rem,3.75cqw,1.2rem);letter-spacing:.15em;text-transform:uppercase;color:var(--pink);opacity:0;animation:none;transition:opacity .8s ease}
#hint.ready{opacity:.85;animation:hintFloat 4s ease-in-out infinite}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.045)}}
#hint .inf{display:inline-block;font-size:2.565em;line-height:0;vertical-align:-.1em;margin:0 .08em}

/* ===== NAME MODAL ===== */
#nameModal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(249,237,213,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .8s}
#nameModal.show{opacity:1;pointer-events:auto}
.card{width:82%;background:var(--white);border:1px solid var(--olive);border-radius:22px;padding:2rem 1.6rem;text-align:center;box-shadow:0 18px 50px rgba(26,61,40,.18);transform:translateY(14px);transition:transform .8s}
#nameModal.show .card{transform:none}
.card h2{font-family:var(--f-names);font-weight:400;font-size:2rem;color:var(--pink)}
.card h2.welcome-word{font-family:var(--fb);letter-spacing:.06em;font-size:2.1rem}
.card p{margin:.4rem 0 1.2rem;color:var(--forest);font-family:var(--f-venue);font-size:1rem;letter-spacing:.02em}
.card input{width:100%;padding:.85rem 1rem;border:1px solid var(--olive);border-radius:12px;background:var(--cream);color:var(--forest);font:1.05rem var(--f-venue);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.card input::placeholder{color:var(--sage)}
.card input:focus{border-color:var(--pink)}
.btn{margin-top:1rem;width:100%;padding:.85rem;border:0;border-radius:12px;background:var(--pink);color:var(--white);font:.95rem var(--fb);letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.loading-dots{display:inline-block;font-weight:700;letter-spacing:.12em;background:linear-gradient(90deg,#E38496 0%,#B2AF87 45%,#1A3D28 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:dotShimmer 1.1s linear infinite}
@keyframes dotShimmer{from{background-position:100% 0}to{background-position:-100% 0}}


/* ===== VERTICAL PAGE TRANSITIONS ===== */
#app{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
#app.on{opacity:1}

.scene{
  --hl:var(--pink);
  position:absolute;
  inset:0;
  background:var(--cream);
  transform:translateY(100%);
  transition:transform 1s cubic-bezier(.65,0,.25,1);
  overflow:hidden;
  will-change:transform;
}
.scene.active{transform:translateY(0)}
.scene.past{transform:translateY(-100%)}

.scene .dimmer{
  display:block;
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
  visibility:hidden;
  background:transparent;
}


/* ===== SCENES ===== */
.scene{--hl:var(--pink);background:var(--cream);overflow:hidden}
.scene[data-event=mehendi],.scene[data-event=haldi]{--hl:var(--white)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s;z-index:0}
.scene.dim img.bg{opacity:.22}
.scene[data-event=main] img.bg{object-position:left center}
.scene[data-event=puja] img.bg{object-position:center top}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;background:var(--cream);color:var(--forest);font-size:.85rem;letter-spacing:.1em;z-index:1}
.ph[hidden],.image-fallback[hidden]{display:none}

/* ===== PAGE 1: BLESSING + OFFERING ===== */
.intro{position:absolute;top:2%;left:5%;width:90%;height:96%;padding-top:0;padding-bottom:6cqh;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--forest);text-shadow:0 0 6px rgba(255,255,255,.55);pointer-events:none;overflow:visible}
.bride-side .intro{padding-bottom:calc(6cqh + 3cqh)}
.scene.active#s0 .intro{animation:flyU 1.3s .4s both}
#inviteGaneshay{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;width:clamp(58px,17cqw,82px);height:clamp(58px,17cqw,82px);object-fit:contain}
html[data-side=groom] #inviteGaneshay{width:clamp(76px,22cqw,106px);height:clamp(76px,22cqw,106px)}
.invite-gap-small{height:1.5cqh;min-height:5px;flex-shrink:0}
.invite-hosts{font-family:var(--f-date);font-size:clamp(11px,3.5cqw,17px);line-height:1.2;letter-spacing:.035em;white-space:nowrap;width:max-content;max-width:100%;margin:0 auto 1.2cqh}
.bride-side .invite-hosts{font-size:calc(clamp(11px,3.5cqw,17px) + 2.5px)}
.invite-statements{font:clamp(9px,3.4cqw,13px)/1.2 var(--f-venue);letter-spacing:.01em}
.invite-statement{font:clamp(12px,3.4cqw,16px)/1.2 var(--f-venue);letter-spacing:.01em;margin:0 0 .7cqh;max-width:100%}
.invite-opening{margin-bottom:1.2cqh}
.invite-opening p{margin:0}
.invite-with{font:clamp(12px,3.4cqw,16px)/1.2 'BodoniVenue',serif;margin:.6cqh 0;position:relative;top:-1.5cqh}
.invite-groom{margin-bottom:-.8cqh;transform:translateX(8cqw)}
h1.invite-name{transform:translateX(-8cqw)}
.groom-side h1.invite-name{transform:translate(-15cqw,1.2cqh)}
.groom-side .invite-with{transform:translateY(.5cqh)}
.groom-side .invite-groom{transform:translate(15cqw,calc(1.2cqh - 12px))}
.groom-side .invite-groom ~ .invite-statement,.groom-side .invite-groom ~ .invite-gap-small,.groom-side .invite-groom ~ .invite-family{transform:translateY(-12px)}
.groom-side .invite-family{position:relative;top:-4px}
.invite-name{font:500 clamp(70px,20cqw,96px)/1.05 var(--f-names);color:var(--pink);-webkit-text-stroke:.5px var(--pink);text-shadow:0 2px 8px rgba(26,61,40,.45);overflow-wrap:anywhere;margin:0;position:relative}
.invite-family{font:500 clamp(36px,10.5cqw,50px)/1.1 var(--f-names);color:var(--pink);-webkit-text-stroke:.5px var(--pink);text-shadow:0 2px 8px rgba(26,61,40,.45);margin-top:0;overflow-wrap:anywhere}
.invite-name::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-stroke:0;text-shadow:none;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,236,170,.95) 47%,#fff 50%,rgba(255,214,111,.95) 53%,transparent 65%);background-size:250% 100%;background-repeat:no-repeat;background-position:150% 0;-webkit-background-clip:text;background-clip:text}
.scene.active#s0 .invite-name::after{animation:foilSweep 2.2s ease-in-out 2.3s 1 both}
@keyframes foilSweep{from{background-position:150% 0}to{background-position:-50% 0}}
#hintG{position:absolute;bottom:max(1.1rem,env(safe-area-inset-bottom));left:5%;width:90%;z-index:3;text-align:center;white-space:normal;opacity:0;pointer-events:none;font-family:var(--fb);font-size:clamp(.855rem,3.56cqw,1.14rem);letter-spacing:.08em;color:var(--forest);text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.9),0 0 28px rgba(255,255,255,.6)}
#hintG.show{animation:petalFadeIn 1.2s ease-out both,hintPromptPulse 2.2s 1.2s ease-in-out infinite}
@keyframes hintPromptPulse{0%,100%{opacity:.85;text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.9),0 0 24px rgba(255,255,255,.65)}50%{opacity:1;text-shadow:0 0 10px #fff,0 0 22px rgba(255,244,191,1),0 0 36px rgba(255,239,175,.95)}}
.offer-sparkle{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff4bf;box-shadow:0 0 5px 2px rgba(255,239,175,.8);pointer-events:none;z-index:101;animation:offerSparkle 1.25s ease-out forwards}
@keyframes offerSparkle{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1)}}
#drop{position:absolute;left:50%;bottom:calc(7% - 39px);width:78px;height:78px;margin-left:-39px;border-radius:50%;border:1.5px dashed var(--white);box-shadow:0 0 20px rgba(255,255,255,.45),inset 0 0 18px rgba(227,132,150,.38);animation:pulse 2.6s infinite;z-index:6}
.tree-art{position:absolute;right:-31%;bottom:0;width:72.5%;height:65%;z-index:5;pointer-events:none;overflow:visible;transform-origin:80% 100%}
.tree-art img,.tree-art svg.t{width:100%;height:100%}
.tree-art img{object-fit:contain;object-position:bottom right}
.scene.active#s0 .tree-art{animation:treeEnter 1.8s cubic-bezier(.2,.75,.25,1) both,treeBobble 16s 1.8s ease-in-out infinite}
@keyframes treeEnter{from{opacity:0;transform:translateX(65%) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes treeBobble{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-2.4deg)}55%{transform:translateX(6px) rotate(1.8deg)}75%{transform:translateX(-5px) rotate(-1.2deg)}}
.flower{position:absolute;width:44.1px;height:44.1px;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scaleX(var(--flip,1));cursor:grab;touch-action:none;z-index:7;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35));transition:transform .35s,opacity .5s;pointer-events:auto}
.flower.drag{transition:none;cursor:grabbing;z-index:30}
.flower img,.flower svg{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}

/* ===== GANPATI (one copy lives inside each page that shows him) ===== */
.gan{position:absolute;z-index:4;pointer-events:none}
#bappa{left:17%;width:66%;top:47.5%;height:49%;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.65,0,.25,1);will-change:transform}
#bappa.up{transform:translateY(-41cqh) scale(.939)}
#bappa.gone{transform:translateY(-144cqh) scale(.939)}
#bappa.gone.fromMain{transform:translateY(-102cqh)}
.gan img.bgan{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;opacity:0;background:transparent;filter:drop-shadow(0 5px 10px rgba(26,61,40,.12))}
#bappa.in img.bgan{animation:flyU 1.5s .5s cubic-bezier(.2,.8,.2,1) both,ganpatiFloat 4.5s 2s ease-in-out infinite}
.gan .image-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;font-size:.85rem;background:transparent;color:var(--forest);text-shadow:0 0 5px var(--cream)}
.gflower{position:absolute;z-index:20;left:50%;bottom:3%;width:44.1px;height:44.1px;transform:translateX(-50%);opacity:0;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35))}
.gflower img,.gflower svg{width:100%;height:100%;object-fit:contain;display:block}
.gan.offered .gflower{opacity:1;transform:translateX(-50%) rotate(0deg)}
.gan.spin .gflower{animation:flowerSpin 1.2s ease-in-out both}
@keyframes flowerSpin{
  from{transform:translateX(-50%) rotate(0deg)}
  to{transform:translateX(-50%) rotate(360deg)}
}

.flower-fly{position:fixed;z-index:150;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35))}
.flower-fly img,.flower-fly svg{width:100%;height:100%;object-fit:contain;display:block}
/* ===== SAGAI CONSTELLATION ===== */
.constellation-layer{position:absolute;inset:0;z-index:20;overflow:hidden;pointer-events:none}
.constellation-heading{position:absolute;top:6%;left:8%;width:84%;text-align:center;color:#fff;font:600 1.05rem/1.4 var(--f-date);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 12px rgba(255,255,255,.7);pointer-events:none}
.constellation-star{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;background:transparent;color:#fff8e9;cursor:pointer;pointer-events:auto;touch-action:manipulation;z-index:21;--lo:.3;--hi:1;filter:drop-shadow(0 0 3px rgba(255,248,223,.85));animation:starGlimmer var(--twinkle,2.8s) ease-in-out infinite}
.constellation-star svg{display:block;width:calc(10px*var(--big,1));height:calc(10px*var(--big,1));overflow:visible;pointer-events:none}
.constellation-star .star-shape{fill:currentColor}
.constellation-star.is-dim{--lo:.12;--hi:.55}
@keyframes starGlimmer{0%,100%{opacity:var(--lo);scale:.7}50%{opacity:var(--hi);scale:1.2}}
.constellation-star::after{content:attr(data-category);position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%);padding:.3rem .55rem;border-radius:20px;background:rgba(20,38,32,.9);color:#fff;font:.58rem var(--f-date);letter-spacing:.08em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.constellation-star:hover::after,.constellation-star:focus-visible::after{opacity:1}
.constellation-star:focus-visible{outline:1px solid #fff;border-radius:50%}
.constellation-star.is-gold{color:#ffd66f;filter:drop-shadow(0 0 3px #fff7d7) drop-shadow(0 0 8px #ffce68) drop-shadow(0 0 17px rgba(255,190,74,.92))}
.constellation-star.is-mine{--lo:.85;--hi:1;color:#ffda78;filter:drop-shadow(0 0 5px #fff7d7) drop-shadow(0 0 13px #ffce68) drop-shadow(0 0 24px rgba(255,190,74,1))}
.constellation-star.is-taken:not(.is-mine){animation:none;opacity:.5;scale:1;color:#ffd66f;filter:drop-shadow(0 0 3px rgba(255,214,111,.9)) drop-shadow(0 0 8px rgba(255,190,74,.6))}
.constellation-ui{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:1.2rem;background:rgba(12,28,23,.56);opacity:0;pointer-events:none;transition:opacity .25s}
.constellation-ui.open{opacity:1;pointer-events:auto}
.constellation-card{width:min(100%,350px);max-height:82%;overflow:auto;padding:1.5rem 1.25rem;border:1px solid #d8c28a;border-radius:20px;background:#fffaf0;color:var(--forest);text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.3);user-select:text;-webkit-user-select:text}
.constellation-card h3{font:700 1.45rem/1.25 var(--f-names);color:var(--pink);margin-bottom:.45rem}
.constellation-card .star-category{font:700 1rem/1.4 var(--f-date);letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin-bottom:.8rem}
.constellation-card .star-fortune{font:700 1.2rem/1.5 var(--f-venue);margin-bottom:1rem}
.constellation-card textarea{display:block;width:100%;min-height:90px;resize:vertical;border:1px solid var(--olive);border-radius:12px;background:#fff;color:var(--forest);padding:.8rem;font:1rem/1.4 var(--f-venue);outline:none}
.constellation-card textarea:focus{border-color:var(--pink)}
.constellation-actions{display:flex;gap:.6rem;margin-top:.8rem}
.constellation-actions button{flex:1;padding:.75rem .45rem;border:0;border-radius:10px;font:.68rem var(--f-date);letter-spacing:.04em;cursor:pointer}
.constellation-seal{background:var(--pink);color:#fff}.constellation-cancel{background:#e9e4d8;color:var(--forest)}
.constellation-status{min-height:1.3em;margin-top:.75rem;font:.8rem/1.4 var(--f-venue);color:var(--sage)}
.constellation-admin{position:absolute;right:.7rem;top:.7rem;z-index:32;padding:.4rem .55rem;border:1px solid rgba(255,255,255,.6);border-radius:8px;background:rgba(12,28,23,.75);color:#fff;font:.55rem var(--f-date);letter-spacing:.04em;pointer-events:auto}
.constellation-admin-panel{position:absolute;inset:0;z-index:35;padding:1rem;background:rgba(10,24,19,.94);color:#fff;overflow:auto;pointer-events:auto;display:none}
.constellation-admin-panel.open{display:block}
.constellation-admin-panel h3{font:1.4rem var(--f-names);margin:1rem 0}
.admin-wish{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.2);font:.8rem/1.4 var(--f-venue);overflow-wrap:anywhere}
.admin-wish button{margin:.4rem .3rem 0 0;padding:.35rem .5rem;border:0;border-radius:6px;background:#d7b45a;color:#17271e;font-size:.7rem}
.admin-close{position:sticky;top:0;float:right;padding:.45rem .65rem;border:0;border-radius:8px}

/* ===== EVENT PAGES ===== */
.ev-over{position:absolute;left:0;right:0;bottom:10%;top:auto;padding:0 .8rem 2.2rem;text-align:center;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(26,61,40,.3)}
.ev-over .tg{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--white)}
.ev-over h2,.ev-over p{font-weight:500;-webkit-text-stroke:.3px currentColor}
.ev-over h2{font-family:var(--f-names);font-weight:500;font-size:clamp(3.5rem,15cqw,4.9rem);line-height:.95;color:var(--hl);margin:.2rem 0 .5rem;overflow-wrap:anywhere}
.ev-over p{color:var(--white);font-size:1rem;margin:.18rem 0}
.bride-side .scene[data-event=mehendi] .ev-over h2,.bride-side .scene[data-event=haldi] .ev-over h2{font-size:clamp(4.1rem,17.5cqw,5.7rem);line-height:1}
.bride-side .scene[data-event=sangeet] .ev-over h2,.groom-side .scene[data-event=sangeet] .ev-over h2{font-size:clamp(4.6rem,20cqw,6.4rem);line-height:1}
.date-time,.host-names{font-family:var(--f-date)}
.venue-row{font-family:var(--f-venue)}
.maplink{display:inline-block;margin-top:.9rem;padding:.55rem 1.3rem;border:1px solid currentColor;border-radius:999px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;pointer-events:auto;cursor:pointer}
.ev-over .maplink{color:var(--white)}
.scene[data-event=puja] .ev-over p,.scene[data-event=puja] .ev-over .maplink{color:var(--sage);text-shadow:0 1px 4px rgba(249,237,213,.55)}
/* Groom GPUJA uses the puja skin; every visible detail stays white */

.next-cue{position:absolute;right:1.1rem;bottom:2.4rem;z-index:12;border:0;background:transparent;color:var(--hl);font:.62rem var(--f-date);letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.32rem;cursor:pointer;padding:.3rem;pointer-events:auto}

/* ===== BELLS: pop in from the top with a bounce ===== */
@keyframes bellPop{
  0%{transform:translateY(-140%);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  45%{transform:translateY(18px);animation-timing-function:ease-out}
  65%{transform:translateY(-9px);animation-timing-function:ease-in-out}
  82%{transform:translateY(4px);animation-timing-function:ease-in-out}
  100%{transform:translateY(0)}
}

.m-bell{position:absolute;top:0;z-index:4;pointer-events:none;transform:translateY(var(--r))}
.m-bell img{display:block;width:auto;height:auto;max-width:none;-webkit-user-drag:none;will-change:transform}
.m-bell-1{right:10px;--r:-25%}
.m-bell-2{right:10px;--r:-30%}
.m-bell-3{right:20px;--r:-40%}
.scene.active .m-in{animation:bellPop 1.1s var(--pd,0s) both}

.scene.active .m-bell img{animation:mBellSwing 4.5s ease-in-out var(--sd,1.4s) infinite}
.scene.active[data-key=haldi] .m-bell img{animation-name:mBellSwingFlip}

}/* Bride Puja wedding bells: pendulum + pop in */

.w-pop{height:100%}
.scene.active .w-pop{animation:bellPop 1.1s var(--pd,0s) both}
.w-bell img{display:block;height:100%;width:auto;max-width:none;object-fit:contain;-webkit-user-drag:none}
.w-bell-left{left:15px;height:95cqh;animation-duration:5.2s;animation-delay:-1.1s}
.w-bell-r1{right:10px;top:70px;height:calc(75cqh - 70px);animation-duration:4.8s;animation-delay:-.4s}
.w-bell-r2{right:50px;top:70px;height:35cqh;animation-duration:5.5s;animation-delay:-1.8s}
@keyframes bellPendulum{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}
/* Tree on bride Puja: slides in from the right (no wobble) */
.puja-tree{position:absolute;right:-45%;top:-10%;bottom:auto;width:96%;height:100%;z-index:5;pointer-events:none;overflow:visible;transform-origin:80% 0}
.puja-tree img,.puja-tree svg.t{display:block;width:100%;height:100%;object-fit:contain;object-position:top right}
.scene.active[data-key=puja] .puja-tree{animation:treeEnter 1.8s cubic-bezier(.2,.75,.25,1) .35s both}
/* Yellow petals (bride Puja): fall to the bottom of the Ganpati frame, then drift and fade slowly */
.ypetal{--yb:calc(55.5cqh + 40px);position:absolute;top:-40px;display:grid;place-items:center;z-index:6;pointer-events:none;animation:yellowFall linear forwards;will-change:transform,opacity}
.ypetal .pi.fb{background:#F4BE43;box-shadow:0 0 8px rgba(232,169,43,.6)}
@keyframes yellowFall{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  8%{opacity:1}
  62%{transform:translate3d(var(--dx),var(--yb),0) rotate(var(--spin));opacity:1}
  100%{transform:translate3d(calc(var(--dx) + var(--sx)),calc(var(--yb) + 8cqh),0) rotate(calc(var(--spin)*1.3));opacity:0}
}
.pixie-orbit{position:relative;display:block;width:27px;height:27px;border:1px solid currentColor;border-radius:50%;animation:cuePulse 2.2s ease-in-out infinite}
.pixie-orbit::before,.pixie-orbit::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.pixie-orbit::before{top:2px;right:1px}.pixie-orbit::after{bottom:1px;left:2px}
@keyframes cuePulse{0%,100%{transform:scale(.94);opacity:.55;box-shadow:0 0 0 0 rgba(227,132,150,.18)}50%{transform:scale(1.04);opacity:1;box-shadow:0 0 0 5px rgba(227,132,150,0)}}

#pop{position:absolute;inset:0;z-index:40;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s}

.pop-orn img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes ornPulse{0%,100%{transform:rotate(10deg) scale(1)}50%{transform:rotate(10deg) scale(1.14)}}
.petal-fly{position:fixed;z-index:150;pointer-events:none}

#final{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:var(--cream) url('assets/bg-logo.jpg') center/cover no-repeat}

.logo-return{position:fixed;z-index:200;object-fit:contain;pointer-events:none;transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),opacity .5s ease}

};

const loadImg=u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>r();i.src=u;if(i.decode)i.decode().then(r,r)});

CRITICAL.then(()=>Promise.all([...SD.order.map(k=>CONFIG.bg[k]),CONFIG.petal,...YELLOW.imgs,...MBELL.map(b=>b.img),'assets/l-wedding-bells.png','assets/R1-wedding-bells.png','assets/R2-wedding-bells.png'].filter(Boolean).map(loadImg)));

const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);
let stage='logo',cur=0,guest='',popOpen=false,locked=false,filled=false,scenes=[],PETAL=0,FINAL=0,ps=null,introTimer=null,introTrailTimer=null,introPromptShown=false,finalReturnTimer=null;

const app=$('#app'),li=$('#logoImg'),frameEl=$('.frame');

/* ---- pixie dust (canvas clipped to the phone frame) ---- */
const cv=$('#dust'),cx=cv.getContext('2d');

function clipDust(){

function rs(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);clipDust()}
rs();addEventListener('resize',rs);
function dust(x,y,o={}){
  const n=o.n||3;
  for(let i=0;i<n;i++)P.push({x:x+rnd(-3,3),y:y+rnd(-3,3),vx:rnd(-.3,.3)*(o.spread||1),vy:rnd(-.35,.15)*(o.spread||1),l:0,m:o.tiny?rnd(55,120):rnd(40,85),s:o.tiny?rnd(.6,1.7):rnd(1.2,2.8),a:o.faint?.38:1,ph:rnd(0,6)});

const burst=(x,y,n=50,o={})=>dust(x,y,{...o,n,spread:o.spread||4});

  const tr=target.getBoundingClientRect(),tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;

        if(cur!==0)return;
        const sp=document.createElement('span');

}
(function loop(){
  if(!cx)return;
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.l++;
    if(p.l>p.m){P.splice(i,1);continue}

  }

function isInfinity(){
  if(pts.length<25)return false;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),w=x1-x0,h=y1-y0;
  if(w<110||h<w*.18||h>w*.95)return false;
  const mx=(x0+x1)/2;let L=0,R=0;
  for(let i=1;i<pts.length-1;i++){
    const a={x:pts[i].x-pts[i-1].x,y:pts[i].y-pts[i-1].y},c={x:pts[i+1].x-pts[i].x,y:pts[i+1].y-pts[i].y};
    const ang=Math.atan2(a.x*c.y-a.y*c.x,a.x*c.x+a.y*c.y);
    if(pts[i].x<mx)L+=ang;else R+=ang;
  }
  return Math.abs(L)>2.2&&Math.abs(R)>2.2&&L*R<0;
}

function textRects(el){
  if(!el)return [];
  const rg=document.createRange();rg.selectNodeContents(el);
  return [...rg.getClientRects()].filter(r=>r.width>2&&r.height>2);
}
/* blocked areas: the actual text lines, map link, and both navigation buttons */
function starGeo(scene){
  const sr=scene.getBoundingClientRect(),rects=[];
  scene.querySelectorAll('.ev-over h2,.ev-over p').forEach(el=>textRects(el).forEach(r=>rects.push({l:r.left,r:r.right,t:r.top,b:r.bottom,pad:14})));
  [['.ev-over .maplink',24],['.next-cue',28],['.back-cue',36]].forEach(([sel,pad])=>{
    const el=scene.querySelector(sel);
    if(el){const r=el.getBoundingClientRect();rects.push({l:r.left,r:r.right,t:r.top,b:r.bottom,pad})}
  });
  return {sr,rects};
}
function starBlocked(g,px,py){
  const sx=g.sr.left+g.sr.width*px/100,sy=g.sr.top+g.sr.height*py/100;
  return g.rects.some(o=>sx>=o.l-o.pad&&sx<=o.r+o.pad&&sy>=o.t-o.pad&&sy<=o.b+o.pad);
}
function randomStarPosition(existing,scene){
  const geo=starGeo(scene);
  let x=6+Math.random()*88,y=15+Math.random()*80,tries=0;
  while(tries++<500&&(existing.some(p=>Math.hypot((p.x-x)*.85,p.y-y)<7)||y<13||starBlocked(geo,x,y))){
    x=6+Math.random()*88;y=15+Math.random()*80;
  }
  return {x,y};
}
function relayoutStars(scene){

  stars.forEach(el=>{
    if(!starBlocked(g,parseFloat(el.style.left),parseFloat(el.style.top)))return;
    const others=stars.filter(s=>s!==el).map(s=>({x:parseFloat(s.style.left),y:parseFloat(s.style.top)}));
    const pos=randomStarPosition(others,scene);
    el.style.left=pos.x+'%';el.style.top=pos.y+'%';

}

/* ---- guest lookup ---- */
let guestEvents=[],guestDisplay='',checking=false,nameNeedsFull=false;
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const GL_KEY='guestCache.'+SIDE;
const glCache=(()=>{try{return JSON.parse(localStorage.getItem(GL_KEY)||'{}')}catch(e){return{}}})();
window.__ping=()=>{};
{const w=document.createElement('script');w.src=CONSTELLATION_API+'?action=ping&callback=__ping&_='+Date.now();w.onload=w.onerror=()=>w.remove();document.head.appendChild(w)}
function canonicalEventKey(value){
  const raw=String(value??'').trim().toLowerCase();
  const compact=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
  if(!compact)return null;
  if(compact==='puja'&&SIDE==='groom')return 'gpuja';
  if(Object.prototype.hasOwnProperty.call(EVENTS,compact))return compact;
  if(compact.includes('sangeet')||compact.includes('sagai'))return 'sangeet';
  if(compact.includes('gpuja'))return 'gpuja';
  if(compact.includes('prempithi'))return SIDE==='groom'?'gpuja':'haldi';
  if(compact.includes('grahamak')||compact.includes('mahurat')||compact.includes('muhurat')||compact.includes('randal')||compact.includes('mandap'))return SIDE==='groom'?'gpuja':'puja';
  if(compact.includes('mehendi')||compact.includes('mehndi'))return 'mehendi';
  if(compact.includes('haldi'))return 'haldi';
  if(compact.includes('puja'))return SIDE==='groom'?'gpuja':'puja';
  if(compact.includes('wedding')||compact.includes('mangalphera')||compact.includes('pher'))return 'wedding';
  return null;
}
function normalizeGuestEvents(events){
  if(!Array.isArray(events))return [];
  return [...new Set(events.map(canonicalEventKey).filter(Boolean))];
}
function fetchGuest(name){
  return new Promise((res,rej)=>{
    const cb='cb'+Date.now(),sc=document.createElement('script');
    const done=()=>{clearTimeout(t);delete window[cb];sc.remove()};
    const t=setTimeout(()=>{done();rej(new Error('timeout'))},8000);
    window[cb]=d=>{done();res(d)};
    sc.onerror=()=>{done();rej(new Error('network'))};
    sc.src=CONSTELLATION_API+'?action=guest&side='+SIDE+'&name='+encodeURIComponent(name)+'&callback='+cb+'&_ts='+Date.now();
    document.head.appendChild(sc);
  });
}
function findGuest(name){
  const key=normName(name);
  return fetchGuest(name).then(d=>{
    if(d&&d.ok){d.events=normalizeGuestEvents(d.events);glCache[key]=d;try{localStorage.setItem(GL_KEY,JSON.stringify(glCache))}catch(e){}}
    return d;
  }).catch(error=>{if(glCache[key])return glCache[key];throw error});   // cache only if the network fails
}
function nameError(msg){
  const c=$('#nameModal .card');
  c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  let err=$('#guestError');
  if(!err){err=document.createElement('p');err.id='guestError';err.style.cssText='color:#B34D62;font-size:.85rem;margin-top:.8rem';$('#nameIn').insertAdjacentElement('afterend',err)}
  err.textContent=msg;
}
async function submitName(){
  if(checking)return;
  const v=$('#nameIn').value.trim().replace(/\s+/g,' ');
  const parts=v.split(' ').filter(Boolean);
  if(!v)return nameError('Please enter your first name.');
  if(!nameNeedsFull&&parts.length!==1)return nameError('Please enter your first name only.');
  if(nameNeedsFull&&parts.length<2)return nameError('Please enter your first and last name.');
  checking=true;
  $('#enterBtn').innerHTML='Checking <span class="loading-dots">...</span>';
  let d;
  try{d=await findGuest(v)}catch(e){d={ok:false,error:'network'}}
  checking=false;
  $('#enterBtn').textContent='Enter';
  if(!d.ok){
    if(d.error==='duplicate'&&!nameNeedsFull){
      nameNeedsFull=true;
      $('#nameIn').placeholder='Enter first and last name';
      return nameError('We found more than one guest with that first name. Please enter your first and last name.');
    }
    const m={network:'Could not check the guest list. Please try again.',duplicate:'This name needs a quick manual check. Please contact the family.',config:'The guest list is not configured correctly. Please contact the family.'};
    return nameError(m[d.error]||'We couldn’t find your invitation. Please check the spelling.');
  }
  nameNeedsFull=false;
  const err=$('#guestError');if(err)err.remove();
  guest=d.name;

/* ---- flower drag (page 1) ---- */
function wireFlower(f){
  let sx,sy,tx=0,ty=0;
  const T=sc=>`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(var(--rot,0deg)) scaleX(var(--flip,1)) scale(${sc})`;
  f.addEventListener('pointerdown',e=>{if(locked)return;e.stopPropagation();tx=ty=0;f.style.transform='';f.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;f.classList.add('drag')});
  f.addEventListener('pointermove',e=>{if(!f.classList.contains('drag'))return;tx=e.clientX-sx;ty=e.clientY-sy;f.style.transform=T(1.25);dust(e.clientX,e.clientY,{n:2,faint:true})});
  f.addEventListener('pointerup',e=>{
    e.stopPropagation();
    if(!f.classList.contains('drag'))return;
    f.classList.remove('drag');
    const d=$('#drop').getBoundingClientRect(),dx=d.left+d.width/2,dy=d.top+d.height/2;
    if(Math.hypot(e.clientX-dx,e.clientY-dy)<d.width*.8&&!locked){

  });
}
/* the dragged flower itself flies onto Bappa (always in front), spins, lands at the same size */
function flyFlowerToBappa(f){
  const bp=$('#bappa'),bf=bp.querySelector('.gflower');
  const r=f.getBoundingClientRect(),t=bf.getBoundingClientRect();
  const sx=r.left+r.width/2,sy=r.top+r.height/2,ex=t.left+t.width/2,ey=t.top+t.height/2,dx=ex-sx,dy=ey-sy;
  const c=document.createElement('div');c.className='flower-fly';c.innerHTML=hibImg;
  c.style.cssText=`left:${sx-t.width/2}px;top:${sy-t.height/2}px;width:${t.width}px;height:${t.height}px`;
  document.body.appendChild(c);
  f.style.transition='none';f.style.opacity=0;

  const a=c.animate([
    {transform:`translate(0,0) scale(${r.width/t.width)`},
    {transform:`translate(${dx}px,${dy}px) scale(1)`}
  ],{duration:900,easing:'cubic-bezier(.35,.7,.3,1)',fill:'forwards'});

  const trail=setInterval(()=>{
    const b=c.getBoundingClientRect();
    dust(b.left+b.width/2,b.top+b.height/2,{n:3,spread:1.4});
  },40);

  a.onfinish=()=>{
    clearInterval(trail);
    c.remove();
    bp.classList.add('offered','spin');
    burst(ex,ey,50,{spread:4});chime();buzz(15);
    setTimeout(()=>go(1),1300);
  };
}

    const c=document.createElement('div');c.className='petal-fly';
    c.style.cssText=`left:${sx-sz/2}px;top:${sy-sz/2}px;width:${sz}px;height:${sz}px`;
    c.appendChild(pc);document.body.appendChild(c);
    const trail=setInterval(()=>{const b=c.getBoundingClientRect();dust(b.left+b.width/2,b.top+b.height/2,{n:2,tiny:true})},40);
    c.animate([
      {transform:'translate(0,0) rotate(0deg) scale(1)'},
      {transform:`translate(${dx*.5}px,${dy*.5-30}px) rotate(120deg) scale(1.2)`,offset:.5},
      {transform:`translate(${dx}px,${dy}px) rotate(10deg) scale(${size/sz})`}
    ],{duration:900,easing:'cubic-bezier(.35,.7,.3,1)',fill:'forwards'}).onfinish=()=>{
      clearInterval(trail);orn.appendChild(pc);c.remove();orn.style.opacity=1;
      burst(t.left+t.width/2,t.top+t.height/2,20,{spread:2});
    };
  });
}
function openPop(){
  const e=EVENTS.wedding,row=(cls,v)=>v?`<div class="row ${cls}">${v}</div>`:'';
  $('#popCard').innerHTML=`<h2 class="fx" style="--d:.1s">${e.title}</h2>${row('date-time fx l',e.date)}${row('date-time fx r',e.time)}${row('venue-row fx l',e.venue)}${row('host-names fx r',e.hosts&&'Hosted by '+e.hosts)}${mapLink(e,1.1)}`;
  popOpen=true;$('#pop').classList.add('show');ps.classList.add('dim');
}
function closePop(){popOpen=false;$('#pop').classList.remove('show');if(ps)ps.classList.remove('dim')}

/* ---- last page → logo: the small logo grows and glides to the centre ---- */
function returnToInfinity(){
  const fl=$('#final .lg'),logo=$('#logo'),box=$('#logoBox'),hint=$('#hint'),fin=$('#final');
  hint.classList.remove('ready');
  if(!fl||fl.style.display==='none'){
    logo.classList.remove('gone');app.classList.remove('on');
    stage='logo';cur=0;drawing=false;pts=[];
    setTimeout(()=>{if(stage==='logo')hint.classList.add('ready')},2000);
    return;
  }
  stage='returning';
  const start=fl.getBoundingClientRect(),clone=fl.cloneNode(true);
  clone.className='logo-return';
  clone.style.cssText=`left:${start.left}px;top:${start.top}px;width:${start.width}px;height:${start.height}px;opacity:1`;
  document.body.appendChild(clone);
  fl.style.visibility='hidden';box.style.visibility='hidden';hint.style.visibility='hidden';
  fin.style.transition='opacity .6s';fin.style.opacity='0';
  logo.classList.remove('gone');
  const target=box.getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    clone.style.left=target.left+'px';clone.style.top=target.top+'px';
    clone.style.width=target.width+'px';clone.style.height=target.height+'px';
  }));
  setTimeout(()=>{
    clone.remove();
    fl.style.visibility='';box.style.visibility='';hint.style.visibility='';
    fin.style.opacity='';fin.style.transition='';
    app.classList.remove('on');$('#nameModal').classList.remove('show');
    stage='logo';cur=0;drawing=false;pts=[];
    setTimeout(()=>{if(stage==='logo')hint.classList.add('ready')},2000);
  },1000);
}

/* ---- global pointer handling (ignores anything outside the phone frame) ---- */
addEventListener('pointerdown',e=>{
  down=null;
  if(!inFrame(e))return;
  down={x:e.clientX,y:e.clientY};
  if(stage==='logo'){drawing=true;pts=[{x:e.clientX,y:e.clientY}];dust(e.clientX,e.clientY,{n:4,tiny:true})}
});
addEventListener('pointermove',e=>{
  if(stage==='logo'&&drawing){
    const l=pts[pts.length-1];
    if(Math.hypot(e.clientX-l.x,e.clientY-l.y)>=6){
      pts.push({x:e.clientX,y:e.clientY});
      if(pts.length%6===0&&isInfinity()){infinityDone();return}
    }
    dust(e.clientX,e.clientY,{n:2,tiny:true,spread:.6});
  }else if(stage==='scenes'&&inFrame(e)&&(e.buttons||e.pointerType==='mouse')&&!e.target.closest('.flower'))dust(e.clientX,e.clientY,{n:1,faint:true,spread:.7});
});
addEventListener('pointerup',e=>{
  if(stage==='logo'){
    if(!drawing){pts=[];return}
    drawing=false;burst(e.clientX,e.clientY,10,{tiny:true,spread:1.5});if(isInfinity())infinityDone();pts=[];return;
  }
  if(stage!=='scenes'||!down)return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);
  down=null;
  const blocked=e.target.closest('.flower,.petal,#nameModal,a,button,input,textarea,.constellation-star,.constellation-ui,.constellation-admin,.constellation-admin-panel');
  if(!inFrame(e)||blocked)return;

  if(cur===0&&!e.target.closest('.flower')){          // any tap on page 1 pulses the flower prompt
    const hint=$('#hintG');
    hint.classList.remove('show');void hint.offsetWidth;hint.classList.add('show');
    introPromptShown=true;
    if(moved>12)return;
  }else if(moved>12)return;

  if(popOpen){closePop();go(FINAL);return}
  const r=frameEl.getBoundingClientRect(),tapX=(e.clientX-r.left)/r.width;
  if(cur===FINAL&&(tapX>=.75||e.target.closest('.lg'))){returnToInfinity();return}   // last page: right side → logo
  if(tapX<.25){dust(e.clientX,e.clientY,{n:16,faint:true,spread:2.5});go(cur-1);return}   // left edge: back
  if(cur===PETAL){                                    // petal page: a tap pulses the prompt
    const hint=ps.querySelector('.petal-hint');
    if(hint.classList.contains('show')){const t=hint.firstElementChild;t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse')}
    return;
  }
  if(cur>=1&&cur<PETAL)go(cur+1);                     // event pages: advance
});
</script>
