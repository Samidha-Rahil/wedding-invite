<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited</title>
<link rel="preload" href="assets/font/milton-one.one.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/font/CinzelRegular-3jEM.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/font/Bodoni%20SvtyTwo%20ITC%20TT%20Book.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* ===== FONTS ===== */
@font-face{font-family:'MiltonOne';src:url('assets/font/milton-one.one.otf') format('opentype');font-display:block}
@font-face{font-family:'CinzelInvite';src:url('assets/font/CinzelRegular-3jEM.ttf') format('truetype');font-display:block}
@font-face{font-family:'BodoniVenue';src:url('assets/font/Bodoni%20SvtyTwo%20ITC%20TT%20Book.ttf') format('truetype');font-display:block}
:root{--fw:min(100vw,calc(100dvh*1080/2412*1.07));font-size:calc(var(--fw)/26.9);--pink:#E38496;--forest:#1A3D28;--white:#fff;--sage:#617764;--olive:#B2AF87;--cream:#F9EDD5;
--f-names:'MiltonOne',serif;--f-date:'CinzelInvite',serif;--f-venue:'BodoniVenue',serif;--fd:'MiltonOne',serif;--fb:'CinzelInvite',serif}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);color:var(--forest);font-family:var(--fb);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

/* ===== PHONE FRAME (size container: all cqw/cqh are relative to it) ===== */
.frame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--fw);height:calc(var(--fw)*2412/1080);container-type:size;overflow:hidden;background:var(--cream);box-shadow:0 0 60px rgba(97,119,100,.25)}
@media (min-width:600px) and (min-height:500px){
  html,body{background:linear-gradient(160deg,#e9dfc8,#cfd6c2)}
  :root{--fw:calc(min(92dvh,860px)*1180/2412)}
  .frame{border-radius:38px;box-shadow:0 0 0 10px #1c1c1c,0 30px 80px rgba(26,61,40,.35)}
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}

/* ===== ANIMATION HELPERS ===== */
.fx{opacity:0}
.fx.l{--a:flyL}.fx.r{--a:flyR}
.scene.active:not(#s0) .fx,#nameModal.show .fx,#pop.show .fx{animation:var(--a,flyU) 1.3s cubic-bezier(.2,.8,.2,1) var(--d,.6s) both}
/* Keep all text readable for the full duration of the page-leave scroll. */
.scene.leaving .fx,
.scene.leaving .intro{
  opacity:1!important;
  animation:none!important;
  transform:none!important;
}
.scene.leaving .constellation-heading{opacity:.8!important;animation:none!important}
.scene.leaving .petal-hint,
.scene.leaving #hintG{opacity:1!important;animation:none!important}
@keyframes flyU{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes flyL{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes flyR{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes ganpatiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ===== LOGO SCREEN ===== */
#logo{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream) url('assets/bg-logo.jpg') center/cover no-repeat;transition:opacity 1.2s}
#logo.gone{opacity:0;pointer-events:none}
#logoBox{width:66%;aspect-ratio:1;display:grid;place-items:center}
#logoBox img{width:100%;height:100%;object-fit:contain}
.mono{display:none;text-align:center;color:var(--pink);font-family:var(--f-names);font-size:3.4rem;line-height:1.1}
.mono small{display:block;font-size:1rem;letter-spacing:.35em;color:var(--forest);margin-top:.6rem;font-family:var(--f-date)}
#hint{margin-top:2.2rem;font-size:clamp(.9rem,3.75cqw,1.2rem);letter-spacing:.15em;text-transform:uppercase;color:var(--pink);opacity:0;animation:none;transition:opacity .8s ease}
#hint.ready{opacity:.85;animation:hintFloat 4s ease-in-out infinite}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.045)}}
#hint .inf{display:inline-block;font-size:2.565em;line-height:0;vertical-align:-.1em;margin:0 .08em}

/* ===== NAME MODAL ===== */
#nameModal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(249,237,213,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .8s}
#nameModal.show{opacity:1;pointer-events:auto}
.card{width:82%;background:var(--white);border:1px solid var(--olive);border-radius:22px;padding:2rem 1.6rem;text-align:center;box-shadow:0 18px 50px rgba(26,61,40,.18);transform:translateY(14px);transition:transform .8s}
#nameModal.show .card{transform:none}
.card h2{font-family:var(--f-names);font-weight:400;font-size:2rem;color:var(--pink)}
.card h2.welcome-word{font-family:var(--fb);letter-spacing:.06em;font-size:2.1rem}
.card p{margin:.4rem 0 1.2rem;color:var(--forest);font-family:var(--f-venue);font-size:1rem;letter-spacing:.02em}
.card input{width:100%;padding:.85rem 1rem;border:1px solid var(--olive);border-radius:12px;background:var(--cream);color:var(--forest);font:1.05rem var(--f-venue);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.card input::placeholder{color:var(--sage)}
.card input:focus{border-color:var(--pink)}
.btn{margin-top:1rem;width:100%;padding:.85rem;border:0;border-radius:12px;background:var(--pink);color:var(--white);font:.95rem var(--fb);letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.loading-dots{display:inline-block;font-weight:700;letter-spacing:.12em;background:linear-gradient(90deg,#E38496 0%,#B2AF87 45%,#1A3D28 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:dotShimmer 1.1s linear infinite}
@keyframes dotShimmer{from{background-position:100% 0}to{background-position:-100% 0}}


/* ===== VERTICAL PAGE TRANSITIONS ===== */
#app{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
#app.on{opacity:1}

.scene{
  --hl:var(--pink);
  position:absolute;
  inset:0;
  background:var(--cream);
  transform:translate3d(0,100%,0);
  transition:transform 1s cubic-bezier(.65,0,.25,1),visibility 0s;
  visibility:hidden;
  overflow:hidden;
  will-change:transform;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
}
/* Only the page on screen and the one sliding out are drawn; the rest cost nothing. */
.scene.active,.scene.leaving{visibility:visible}
.scene.active{transform:translate3d(0,0,0)}
.scene.past{transform:translate3d(0,-100%,0)}

.scene .dimmer{
  display:block;
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
  visibility:hidden;
  background:transparent;
}


/* ===== SCENES ===== */
.scene{--hl:var(--pink);background:var(--cream);overflow:hidden}
.scene[data-event=mehendi],.scene[data-event=haldi]{--hl:var(--white)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s;z-index:0}
.scene.dim img.bg{opacity:.22}
.scene[data-event=main] img.bg{object-position:left center}
.scene[data-event=puja] img.bg{object-position:center top}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;background:var(--cream);color:var(--forest);font-size:.85rem;letter-spacing:.1em;z-index:1}
.ph[hidden],.image-fallback[hidden]{display:none}

/* ===== PAGE 1: BLESSING + OFFERING ===== */
.intro{position:absolute;top:2%;left:5%;width:90%;height:96%;padding-top:0;padding-bottom:6cqh;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--forest);text-shadow:0 0 6px rgba(255,255,255,.55);pointer-events:none;overflow:visible}
.bride-side .intro{padding-bottom:calc(6cqh + 3cqh)}
.scene.active#s0 .intro{animation:flyU 1.3s .4s both}
#inviteGaneshay{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;width:clamp(58px,17cqw,82px);height:clamp(58px,17cqw,82px);object-fit:contain}
html[data-side=groom] #inviteGaneshay{width:clamp(76px,22cqw,106px);height:clamp(76px,22cqw,106px)}
.invite-gap-small{height:1.5cqh;min-height:5px;flex-shrink:0}
.invite-hosts{font-family:var(--f-date);font-size:clamp(11px,3.5cqw,17px);line-height:1.2;letter-spacing:.035em;white-space:nowrap;width:max-content;max-width:100%;margin:0 auto 1.2cqh}
.bride-side .invite-hosts{font-size:calc(clamp(11px,3.5cqw,17px) + 2.5px)}
.invite-statements{font:clamp(9px,3.4cqw,13px)/1.2 var(--f-venue);letter-spacing:.01em}
.invite-statement{font:clamp(12px,3.4cqw,16px)/1.2 var(--f-venue);letter-spacing:.01em;margin:0 0 .7cqh;max-width:100%}
.invite-opening{margin-bottom:1.2cqh}
.invite-opening p{margin:0}
.invite-with{font:clamp(12px,3.4cqw,16px)/1.2 'BodoniVenue',serif;margin:.6cqh 0;position:relative;top:-1.5cqh}
.invite-groom{margin-bottom:-.8cqh;transform:translateX(8cqw)}
h1.invite-name{transform:translateX(-8cqw)}
.groom-side h1.invite-name{transform:translate(-15cqw,1.2cqh)}
.groom-side .invite-with{transform:translateY(.5cqh)}
.groom-side .invite-groom{transform:translate(15cqw,calc(1.2cqh - 12px))}
.groom-side .invite-groom ~ .invite-statement,.groom-side .invite-groom ~ .invite-gap-small,.groom-side .invite-groom ~ .invite-family{transform:translateY(-12px)}
.groom-side .invite-family{position:relative;top:-4px}
.invite-name{font:500 clamp(70px,20cqw,96px)/1.05 var(--f-names);color:var(--pink);-webkit-text-stroke:.5px var(--pink);text-shadow:0 2px 8px rgba(26,61,40,.45);overflow-wrap:anywhere;margin:0;position:relative}
.invite-family{font:500 clamp(36px,10.5cqw,50px)/1.1 var(--f-names);color:var(--pink);-webkit-text-stroke:.5px var(--pink);text-shadow:0 2px 8px rgba(26,61,40,.45);margin-top:0;overflow-wrap:anywhere}
.invite-name::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-stroke:0;text-shadow:none;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,236,170,.95) 47%,#fff 50%,rgba(255,214,111,.95) 53%,transparent 65%);background-size:250% 100%;background-repeat:no-repeat;background-position:150% 0;-webkit-background-clip:text;background-clip:text}
.scene.active#s0 .invite-name::after{animation:foilSweep 2.2s ease-in-out 2.3s 1 both}
@keyframes foilSweep{from{background-position:150% 0}to{background-position:-50% 0}}
#hintG{position:absolute;bottom:max(1.1rem,env(safe-area-inset-bottom));left:5%;width:90%;z-index:3;text-align:center;white-space:normal;opacity:0;pointer-events:none;font-family:var(--fb);font-size:clamp(.855rem,3.56cqw,1.14rem);letter-spacing:.08em;color:var(--forest);text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.9),0 0 28px rgba(255,255,255,.6)}
#hintG.show{animation:petalFadeIn 1.2s ease-out both,hintPromptPulse 2.2s 1.2s ease-in-out infinite}
@keyframes hintPromptPulse{0%,100%{opacity:.85;text-shadow:0 0 6px #fff,0 0 14px rgba(255,255,255,.9),0 0 24px rgba(255,255,255,.65)}50%{opacity:1;text-shadow:0 0 10px #fff,0 0 22px rgba(255,244,191,1),0 0 36px rgba(255,239,175,.95)}}
.offer-sparkle{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff4bf;box-shadow:0 0 5px 2px rgba(255,239,175,.8);pointer-events:none;z-index:101;animation:offerSparkle 1.25s ease-out forwards}
@keyframes offerSparkle{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.1)}}
#drop{position:absolute;left:50%;bottom:calc(7% - 39px);width:78px;height:78px;margin-left:-39px;border-radius:50%;border:1.5px dashed var(--white);box-shadow:0 0 20px rgba(255,255,255,.45),inset 0 0 18px rgba(227,132,150,.38);animation:pulse 2.6s infinite;z-index:6}
.tree-art{position:absolute;right:-31%;bottom:0;width:72.5%;height:65%;z-index:5;pointer-events:none;overflow:visible}
.tree-art-inner{position:absolute;inset:0;transform-origin:80% 100%}
.tree-art img,.tree-art svg.t{width:100%;height:100%}
.tree-art img{object-fit:contain;object-position:bottom right}
.scene.active#s0 .tree-art{animation:treeEnter 1.8s cubic-bezier(.2,.75,.25,1) both}
.scene.active#s0 .tree-art-inner,.scene.leaving#s0 .tree-art-inner{animation:treeBobble 16s 1.8s ease-in-out infinite}
@keyframes treeEnter{from{opacity:0;transform:translateX(65%) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes treeBobble{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-2.4deg)}55%{transform:translateX(6px) rotate(1.8deg)}75%{transform:translateX(-5px) rotate(-1.2deg)}}
.flower{position:absolute;width:44.1px;height:44.1px;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scaleX(var(--flip,1));cursor:grab;touch-action:none;z-index:7;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35));transition:transform .35s,opacity .5s;pointer-events:auto}
.flower.drag{transition:none;cursor:grabbing;z-index:30}
.flower img,.flower svg{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}

/* ===== GANPATI (one copy lives inside each page that shows him) ===== */
.gan{position:absolute;z-index:4;pointer-events:none;isolation:isolate}
#bappa{left:17%;width:66%;top:47.5%;height:49%;transform-origin:50% 100%;transition:transform 1s cubic-bezier(.65,0,.25,1);will-change:transform}
#bappa.up{transform:translateY(-41cqh) scale(.939)}
#bappa.gone{transform:translateY(-144cqh) scale(.939)}
#bappa.gone.fromMain{transform:translateY(-102cqh)}
.gan img.bgan{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;opacity:0;background:transparent;filter:drop-shadow(0 5px 10px rgba(26,61,40,.12))}
#bappa.in img.bgan{animation:flyU 1.5s .5s cubic-bezier(.2,.8,.2,1) both,ganpatiFloat 4.5s 2s ease-in-out infinite}
.gan .image-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;font-size:.85rem;background:transparent;color:var(--forest);text-shadow:0 0 5px var(--cream)}
.gflower{
  position:absolute;
  z-index:999;
  left:50%;
  bottom:3%;
  width:44.1px;
  height:44.1px;
  transform:translateX(-50%);
  opacity:0;
  filter:drop-shadow(0 2px 6px rgba(26,61,40,.35));
  pointer-events:none;
  isolation:isolate;
}
.gflower img,.gflower svg{
  position:relative;
  z-index:999;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.gan.offered .gflower{opacity:1;transform:translateX(-50%) rotate(0deg)}
.gan.spin .gflower{animation:flowerSpin 1.1s linear both}
@keyframes flowerSpin{
  from{transform:translateX(-50%) rotate(0deg)}
  to{transform:translateX(-50%) rotate(360deg)}
}

/* The flying offering must remain above every page element, including Ganpati. */
.flower-fly{
  position:fixed;
  z-index:2147483647;
  pointer-events:none;
  filter:drop-shadow(0 2px 6px rgba(26,61,40,.35));
  isolation:isolate;
}
.flower-fly img,.flower-fly svg{
  position:relative;
  z-index:2147483647;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
/* ===== SAGAI CONSTELLATION ===== */
.constellation-layer{position:absolute;inset:0;z-index:20;overflow:hidden;pointer-events:none}

/* Sangeet prompt: clean, softly glowing white text with decorative stars above. */
.constellation-heading{
  position:absolute;
  top:17%;
  left:8%;
  width:84%;
  text-align:center;
  color:#fff;
  font:600 1.05rem/1.4 var(--f-date);
  letter-spacing:.16em;
  text-transform:uppercase;
  pointer-events:none;
  opacity:0;
  isolation:isolate;
  text-shadow:0 0 8px rgba(255,255,255,.7),0 0 18px rgba(255,255,255,.42),0 0 30px rgba(255,255,255,.22);
}

.scene.active .constellation-heading{
  animation:constellationPromptFade 1.4s ease-out .8s both,
            constellationPromptGlow 3.2s ease-in-out 2.2s infinite;
}

/* The prompt is kept clean: no decorative row of stars beside the instruction. */

@keyframes constellationPromptFade{
  from{opacity:0;text-shadow:0 0 0 rgba(255,255,255,0)}
  to{opacity:.8;text-shadow:0 0 8px rgba(255,255,255,.7),0 0 18px rgba(255,255,255,.42),0 0 30px rgba(255,255,255,.22)}
}
@keyframes constellationPromptGlow{
  0%,100%{text-shadow:0 0 8px rgba(255,255,255,.7),0 0 18px rgba(255,255,255,.42),0 0 30px rgba(255,255,255,.22)}
  50%{text-shadow:0 0 11px rgba(255,255,255,.85),0 0 23px rgba(255,255,255,.52),0 0 36px rgba(255,255,255,.28)}
}
.constellation-star{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;background:transparent;color:#fff8e9;cursor:pointer;pointer-events:auto;touch-action:manipulation;z-index:21;--lo:.3;--hi:1;animation:starGlimmer var(--twinkle,2.8s) ease-in-out infinite}
.constellation-star svg{display:block;width:var(--star-size,10px);height:var(--star-size,10px);overflow:visible;pointer-events:none;filter:drop-shadow(0 0 3px rgba(255,248,223,.65));opacity:1;transition:opacity .9s ease,width .9s ease,height .9s ease}  .constellation-star.is-size-1{--star-size:4px} .constellation-star.is-size-2{--star-size:6px} .constellation-star.is-size-3{--star-size:8px} .constellation-star.is-size-4{--star-size:10px}
.constellation-star .star-shape{fill:currentColor}
.constellation-star.is-dim{--lo:.12;--hi:.55}
.constellation-star.is-entering svg,.constellation-star.is-leaving svg{opacity:0}
.constellation-star.is-leaving{pointer-events:none}
.scene:not(.active) .constellation-star{animation-play-state:paused}
@keyframes starGlimmer{0%,100%{opacity:var(--lo);scale:.7}50%{opacity:var(--hi);scale:1.2}}
.constellation-star::after{content:none}
.constellation-star:focus-visible{outline:1px solid #fff;border-radius:50%}
/* The guest's own sealed star: kept for them, always the biggest and brightest. */
.constellation-star.is-mine{--lo:.92;--hi:1;--star-size:10px;color:#ffe08a;z-index:23;animation:mineGlow 3.2s ease-in-out infinite}
.constellation-star.is-mine svg{filter:drop-shadow(0 0 4px #fff7d7) drop-shadow(0 0 12px #ffce68) drop-shadow(0 0 26px rgba(255,190,74,1))}
.constellation-star.is-mine::before{content:"";position:absolute;width:15px;height:15px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,111,.42),rgba(255,214,111,0) 50%);pointer-events:none}
@keyframes mineGlow{0%,100%{opacity:.92;scale:1}50%{opacity:1;scale:1.04}}
/* Earlier sealed stars: still golden, just smaller than the newest one. */
.constellation-star.is-old{--lo:.8;--hi:1;--star-size:10px;color:#ffd66f;z-index:22;animation:mineGlow 3.6s ease-in-out infinite}
.constellation-star.is-old svg{filter:drop-shadow(0 0 3px #fff7d7) drop-shadow(0 0 8px #ffce68)}
.constellation-star.is-other-claimed{
  --star-size:4px;
  --lo:.35;
  --hi:.55;
  color:#c8ad63;
  z-index:21;
}
.constellation-star.is-other-claimed svg{
  filter:drop-shadow(0 0 1px rgba(200,173,99,.3));
}
.constellation-ui{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:1.2rem;background:rgba(12,28,23,.56);opacity:0;pointer-events:none;transition:opacity .25s}
.constellation-ui.open{opacity:1;pointer-events:auto}
.constellation-card{width:min(100%,350px);max-height:82%;overflow:auto;padding:1.5rem 1.25rem;border:1px solid #d8c28a;border-radius:20px;background:#fffaf0;color:var(--forest);text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.3);user-select:text;-webkit-user-select:text}
.constellation-card h3{font:700 1.45rem/1.25 var(--f-names);color:var(--pink);margin-bottom:.45rem}
.constellation-card .star-category{font:700 1rem/1.4 var(--f-date);letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin-bottom:.8rem}
.constellation-card .star-fortune{font:700 1.2rem/1.5 var(--f-venue);margin-bottom:1rem}
.constellation-card textarea{display:block;width:100%;min-height:90px;resize:vertical;border:1px solid var(--olive);border-radius:12px;background:#fff;color:var(--forest);padding:.8rem;font:1rem/1.4 var(--f-venue);outline:none}
.constellation-card textarea:focus{border-color:var(--pink)}
.constellation-actions{display:flex;gap:.6rem;margin-top:.8rem}
.constellation-actions button{flex:1;padding:.75rem .45rem;border:0;border-radius:10px;font:.68rem var(--f-date);letter-spacing:.04em;cursor:pointer}
.constellation-seal{background:var(--pink);color:#fff}.constellation-cancel{background:#e9e4d8;color:var(--forest)}
.constellation-status{min-height:1.3em;margin-top:.75rem;font:.8rem/1.4 var(--f-venue);color:var(--sage)}
.constellation-admin{position:absolute;right:.7rem;top:.7rem;z-index:32;padding:.4rem .55rem;border:1px solid rgba(255,255,255,.6);border-radius:8px;background:rgba(12,28,23,.75);color:#fff;font:.55rem var(--f-date);letter-spacing:.04em;pointer-events:auto}
.constellation-admin-panel{position:absolute;inset:0;z-index:35;padding:1rem;background:rgba(10,24,19,.94);color:#fff;overflow:auto;pointer-events:auto;display:none}
.constellation-admin-panel.open{display:block}
.constellation-admin-panel h3{font:1.4rem var(--f-names);margin:1rem 0}
.admin-wish{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.2);font:.8rem/1.4 var(--f-venue);overflow-wrap:anywhere}
.admin-wish button{margin:.4rem .3rem 0 0;padding:.35rem .5rem;border:0;border-radius:6px;background:#d7b45a;color:#17271e;font-size:.7rem}
.admin-close{position:sticky;top:0;float:right;padding:.45rem .65rem;border:0;border-radius:8px}

  .constellation-card .star-category{
  margin:.9rem 0 0;
  font:italic .8rem/1.4 var(--f-venue);
  letter-spacing:.02em;
  text-transform:none;
  color:var(--sage);
}
.constellation-card .star-category[hidden]{
  display:none;
} 
/* ===== EVENT PAGES ===== */
.ev-over{position:absolute;left:0;right:0;bottom:10%;top:auto;padding:0 .8rem 2.2rem;text-align:center;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(26,61,40,.3)}
.ev-over .tg{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--white)}
.ev-over h2,.ev-over p{font-weight:500;-webkit-text-stroke:.3px currentColor}
.ev-over h2{font-family:var(--f-names);font-weight:500;font-size:clamp(3.5rem,15cqw,4.9rem);line-height:.95;color:var(--hl);margin:.2rem 0 .5rem;overflow-wrap:anywhere}
.ev-over p{color:var(--white);font-size:1rem;margin:.18rem 0}
.bride-side .scene[data-event=mehendi] .ev-over h2,.bride-side .scene[data-event=haldi] .ev-over h2{font-size:clamp(4.1rem,17.5cqw,5.7rem);line-height:1}
.bride-side .scene[data-event=sangeet] .ev-over h2,.groom-side .scene[data-event=sangeet] .ev-over h2{font-size:clamp(4.6rem,20cqw,6.4rem);line-height:1}
.date-time,.host-names{font-family:var(--f-date)}
.venue-row{font-family:var(--f-venue)}
.maplink{display:inline-block;margin-top:.9rem;padding:.55rem 1.3rem;border:1px solid currentColor;border-radius:999px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;pointer-events:auto;cursor:pointer}
.ev-over .maplink{color:var(--white)}
.scene[data-event=puja] .ev-over p,.scene[data-event=puja] .ev-over .maplink{color:var(--sage);text-shadow:0 1px 4px rgba(249,237,213,.55)}
/* Groom GPUJA uses the puja skin; every visible detail stays white */
.scene[data-key=gpuja] .ev-over,.scene[data-key=gpuja] .ev-over h2,.scene[data-key=gpuja] .ev-over p,.scene[data-key=gpuja] .ev-over .maplink{color:#fff!important;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.scene[data-key=gpuja] .ev-over{top:19%;bottom:auto;padding:0 .8rem;text-align:center}
.scene[data-key=gpuja] .ev-over h2{font-size:clamp(4.6rem,20cqw,6.4rem);line-height:1}
.scene[data-key=gpuja] .next-cue-label{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.next-cue{position:absolute;right:1.1rem;bottom:2.4rem;z-index:12;border:0;background:transparent;color:var(--hl);font:.62rem var(--f-date);letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.32rem;cursor:pointer;padding:.3rem;pointer-events:auto}
.next-cue-label{text-shadow:0 1px 5px rgba(26,61,40,.5)}
.back-cue{position:absolute;left:1.1rem;bottom:2.4rem;z-index:12;width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid currentColor;border-radius:50%;background:rgba(255,255,255,.2);color:var(--hl);opacity:.45;cursor:pointer;pointer-events:auto;transition:opacity .3s}
.back-cue:active{opacity:.8}
.back-cue svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene[data-key=gpuja] .back-cue{color:#fff}

/* ===== BELLS: pop in from the top with a bounce ===== */
@keyframes bellPop{
  0%{transform:translateY(-140%);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  45%{transform:translateY(18px);animation-timing-function:ease-out}
  65%{transform:translateY(-9px);animation-timing-function:ease-in-out}
  82%{transform:translateY(4px);animation-timing-function:ease-in-out}
  100%{transform:translateY(0)}
}
/* Mehendi bells: natural size. --r = rest position (share of own height above the frame) */
.m-bell{position:absolute;top:-30px;z-index:4;pointer-events:none;transform:translateY(var(--r))}
.m-bell img{display:block;width:auto;height:auto;max-width:none;-webkit-user-drag:none;will-change:transform}
.m-bell-1{left:10px;right:auto;--r:-25%}
.m-bell-2{left:10px;right:auto;--r:-30%}
.m-bell-3{left:20px;right:auto;--r:-40%}
.scene.active .m-in{animation:bellPop 1.1s var(--pd,0s) both}

  /* Continuous staggered bell wave: each bell moves down, then rises.
   The 0.8s offsets create the repeating 1-2-1-3-2-1-3-2 sequence. */
.scene.active .m-bell img{
  animation:mBellSwing 3.2s ease-in-out var(--sd,0s) infinite;
}
.scene.active[data-key=haldi] .m-bell img{
  animation-name:mBellSwingFlip;
}

/* Down at the midpoint, return to the starting position at the end. */
@keyframes mBellSwing{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(16px)}
}

/* Identical timing and movement, but vertically flipped for Haldi. */
@keyframes mBellSwingFlip{
  0%,100%{transform:translateY(0) scaleY(-1)}
  50%{transform:translateY(16px) scaleY(-1)}
}

  /* Bride Puja wedding bells: pendulum + pop in */
.w-bell{
  position:absolute;
  top:-40px;
  height:75cqh;
  width:max-content;
  z-index:6;
  pointer-events:none;
  transform-origin:top center;
  animation:bellPendulum 4.8s ease-in-out infinite alternate;
  will-change:transform;
}

.w-pop{
  height:100%;
  animation:none;
}

/* Bounce each Puja bell image independently; its parent keeps the pendulum motion. */
.w-bell img{display:block;height:100%;width:auto;max-width:none;object-fit:contain;-webkit-user-drag:none;transform-origin:top center}
.w-bell img.is-bouncing{animation:bellPop 1.1s var(--bounce-delay,0s) both}
.w-bell-left{left:15px;height:95cqh;animation-duration:5.2s;animation-delay:-1.1s}
.w-bell-r1{right:10px;top:70px;height:calc(75cqh - 70px);animation-duration:4.8s;animation-delay:-.4s}
.w-bell-r2{right:50px;top:70px;height:35cqh;animation-duration:5.5s;animation-delay:-1.8s}
@keyframes bellPendulum{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}
/* Tree on bride Puja: slides in from the right (no wobble) */
.puja-tree{   position:absolute;   right:-45%;   top:-10%;   bottom:auto;   width:96%;   height:100%;   z-index:7;   pointer-events:none;   overflow:visible;   transform-origin:80% 0; }
.puja-tree img,.puja-tree svg.t{display:block;width:100%;height:100%;object-fit:contain;object-position:top right}
.scene.active[data-key=puja] .puja-tree{animation:treeEnter 1.8s cubic-bezier(.2,.75,.25,1) .35s both}
/* Yellow petals (bride Puja): fall to the bottom of the Ganpati frame, then drift and fade slowly */
.ypetal{--yb:calc(55.5cqh + 40px);position:absolute;top:-40px;display:grid;place-items:center;z-index:6;pointer-events:none;animation:yellowFall linear forwards;will-change:transform,opacity}
.ypetal .pi.fb{background:#F4BE43;box-shadow:0 0 8px rgba(232,169,43,.6)}
@keyframes yellowFall{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  8%{opacity:1}
  62%{transform:translate3d(var(--dx),var(--yb),0) rotate(var(--spin));opacity:1}
  100%{transform:translate3d(calc(var(--dx) + var(--sx)),calc(var(--yb) + 8cqh),0) rotate(calc(var(--spin)*1.3));opacity:0}
}
.pixie-orbit{position:relative;display:block;width:27px;height:27px;border:1px solid currentColor;border-radius:50%;animation:cuePulse 2.2s ease-in-out infinite}
.pixie-orbit::before,.pixie-orbit::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.pixie-orbit::before{top:2px;right:1px}.pixie-orbit::after{bottom:1px;left:2px}
@keyframes cuePulse{0%,100%{transform:scale(.94);opacity:.55;box-shadow:0 0 0 0 rgba(227,132,150,.18)}50%{transform:scale(1.04);opacity:1;box-shadow:0 0 0 5px rgba(227,132,150,0)}}

/* ===== SHOOTING STARS (sangeet) + HALDI SHIMMER ===== */
.shoot{position:absolute;z-index:5;width:var(--len);height:2px;border-radius:2px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));box-shadow:0 0 8px rgba(255,255,255,.7);transform-origin:0 50%;animation:shootRun 1.1s ease-in forwards}
@keyframes shootRun{0%{opacity:0;transform:rotate(25deg) translateX(0)}15%{opacity:1}100%{opacity:0;transform:rotate(25deg) translateX(300px)}}
.scene[data-event=haldi] .ev-over h2{position:relative}
.scene[data-event=haldi] .ev-over h2::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-stroke:0;text-shadow:none;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,205,70,.95) 46%,#fff0a8 50%,rgba(255,190,50,.95) 54%,transparent 65%);background-size:250% 100%;background-repeat:no-repeat;background-position:150% 0;-webkit-background-clip:text;background-clip:text}
.scene.active[data-event=haldi] .ev-over h2::after{animation:haldiSweep 8s ease-in-out 2.6s infinite}

@keyframes haldiSweep{
  0%{background-position:150% 0}
  44%,100%{background-position:-50% 0}
}

/* MEHENDI: slow dark-olive sweep with a henna-red colour change */
.scene[data-event=mehendi] .ev-over h2{
  position:relative;
  animation:mehendiHennaTint 10s ease-in-out 7.8s infinite;
}

.scene[data-event=mehendi] .ev-over h2::after{
  content:attr(data-t);
  position:absolute;
  inset:0;
  color:transparent;
  -webkit-text-stroke:0;
  text-shadow:none;
  pointer-events:none;
  background:linear-gradient(
    105deg,
    transparent 34%,
    rgba(58,66,29,.88) 44%,
    #454b24 49%,
    #626b36 52%,
    rgba(58,66,29,.88) 57%,
    transparent 67%
  );
  background-size:250% 100%;
  background-repeat:no-repeat;
  background-position:150% 0;
  -webkit-background-clip:text;
  background-clip:text;
}

.scene.active[data-event=mehendi] .ev-over h2::after{
  animation:mehendiOliveSweep 10s ease-in-out 2.6s infinite;
}

@keyframes mehendiOliveSweep{
  0%{background-position:150% 0}
  48%{background-position:-50% 0}
  100%{background-position:-50% 0}
}

@keyframes mehendiHennaTint{
  0%,12%,78%,100%{color:#fff}
  30%,52%{color:#762b32}
  64%{color:#fff}
}

/* Floating dark-olive specks */
.henna-speck{
  position:absolute;
  z-index:6;
  width:var(--s);
  height:var(--s);
  border-radius:50%;
  pointer-events:none;
  background:#454b24;
  box-shadow:0 0 5px 1px rgba(69,75,36,.5);
  opacity:0;
  animation:hennaSpeckRise 3.8s ease-out forwards;
}

@keyframes hennaSpeckRise{
  0%{
    opacity:0;
    transform:translate(0,0) scale(.5);
  }
  18%{opacity:.9}
  100%{
    opacity:0;
    transform:translate(var(--dx),calc(var(--dy)*-1)) scale(.25);
  }
}

.powder{position:absolute;z-index:6;width:var(--s);height:var(--s);border-radius:50%;pointer-events:none;background:#FFE9A8;box-shadow:0 0 6px 2px rgba(255,200,70,.85);opacity:0;animation:powderRise 2.4s ease-out forwards}
@keyframes powderRise{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy)*-1)) scale(.3)}}

/* ===== WEDDING PAGE: FALLING PETALS ===== */
.petal-hint{position:absolute;top:30%;left:5%;width:90%;transform:translateY(-50%);z-index:20;text-align:center;opacity:0;pointer-events:none;font-family:var(--fb);font-size:clamp(.855rem,3.56cqw,1.14rem);line-height:1.2;letter-spacing:.07em;color:var(--pink);text-shadow:0 0 8px rgba(255,255,255,.98),0 0 18px rgba(227,132,150,.95),0 0 34px rgba(227,132,150,.65)}
.petal-hint.show{animation:petalPromptEntrance 1.4s ease-out both,petalSoftGlow 3.2s 1.4s ease-in-out infinite}
.scene.dim .petal-hint{opacity:0!important;transition:opacity .4s}
.hint-text{display:inline-block;transform-origin:center}
.hint-text.pulse{animation:hintPulse 1.6s ease-in-out 1}
@keyframes hintPulse{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(1.05)}}
@keyframes petalFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:.9;transform:none}}
@keyframes petalPromptEntrance{from{opacity:0;transform:translateY(calc(-50% + 28px))}to{opacity:1;transform:translateY(-50%)}}
@keyframes petalSoftGlow{0%,100%{opacity:1;text-shadow:0 0 8px rgba(255,255,255,.98),0 0 18px rgba(227,132,150,.9),0 0 30px rgba(227,132,150,.55)}50%{opacity:1;text-shadow:0 0 12px #fff,0 0 24px #E38496,0 0 40px rgba(227,132,150,.75)}}
.petal{position:absolute;top:-90px;display:grid;place-items:center;animation:fall linear forwards;z-index:5;cursor:pointer;will-change:transform}
.pi{display:block;width:var(--s);height:var(--s);pointer-events:none;animation:tumble var(--td) ease-in-out infinite alternate;opacity:var(--o,1)}
.pi img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.pi.fb{width:calc(var(--s)*.6);height:calc(var(--s)*.85);border-radius:70% 0 70% 0;background:var(--pink);box-shadow:0 0 10px rgba(227,132,150,.6)}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(var(--dx2),58cqh,0) rotate(calc(var(--spin)*.5))}100%{transform:translate3d(var(--dx),122cqh,0) rotate(var(--spin))}}
@keyframes tumble{from{transform:perspective(420px) scaleX(var(--fl)) rotate(var(--r0)) rotateX(0) rotateY(0) translateX(calc(var(--sw)*-1))}to{transform:perspective(420px) scaleX(var(--fl)) rotate(var(--r1)) rotateX(var(--rx)) rotateY(var(--ry)) translateX(var(--sw))}}
#pop{position:absolute;inset:0;z-index:40;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
#pop.show{opacity:1;pointer-events:auto}
#pop:not(.show) .maplink{pointer-events:none}
.scene:not(.active) .maplink{pointer-events:none!important}
.scene[data-event=wedding] .maplink{display:none!important}
#pop .card{width:84%}
#pop .row{margin-top:.7rem;color:var(--forest);font-size:.95rem}
#pop .maplink{color:var(--pink)}
#popCard{position:relative}
#popCard h2{font-size:4.1rem;line-height:1.05;overflow-wrap:anywhere;-webkit-text-stroke:.5px currentColor}
.pop-orn{position:absolute;top:-24px;left:50%;width:48px;height:48px;margin-left:-24px;transform:rotate(10deg);transition:opacity .3s;filter:drop-shadow(0 0 6px rgba(227,132,150,.7));animation:ornPulse 2.6s ease-in-out infinite}
.pop-orn img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes ornPulse{0%,100%{transform:rotate(10deg) scale(1)}50%{transform:rotate(10deg) scale(1.14)}}
.petal-fly{position:fixed;z-index:150;pointer-events:none}

/* ===== FINAL PAGE ===== */
#final{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;background:var(--cream) url('assets/bg-logo.jpg') center/cover no-repeat}
.final-greeting,#final h1{font-family:var(--fd);font-weight:500;color:var(--pink);-webkit-text-stroke:.3px currentColor}
.final-greeting{font-size:calc(clamp(1.8rem,7cqw,2.6rem) + 6px);line-height:1.2;margin-bottom:1.3rem}
#final h1{font-size:clamp(4.8rem,22cqw,6.8rem);line-height:1.05;text-wrap:balance}
#final .lg{width:34%;margin-top:1.35rem;transition:transform .9s ease,opacity .9s ease}
#final .final-blessings{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:.6rem;font-family:var(--f-date);font-size:clamp(10px,2.8cqw,14px);line-height:1.35;letter-spacing:.035em;text-align:center;color:var(--forest);opacity:.82;max-width:100%}
.logo-return{position:fixed;z-index:200;object-fit:contain;pointer-events:none;transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),opacity .5s ease}

/* Option C: blurred, tinted copy of the main background */
html,body{background:#1d2b22!important}
body::before{content:"";position:fixed;inset:-40px;z-index:-1;background:url('assets/bg-logo.jpg') center/cover;filter:blur(28px) brightness(.8)}

/* ===== UX PASS: prompts, nav, fonts, a11y ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{touch-action:pinch-zoom}
#logo,#s0,.scene[data-key=wedding]{touch-action:none}
.ic{width:1.5em;height:1.5em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.tap{animation:icTap 1.4s ease-in-out infinite}.ic.drag{animation:icDrag 1.8s ease-in-out infinite}.ic.up{width:1.3em;height:1.3em;animation:icUp 1.2s ease-in-out infinite}
@keyframes icTap{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-3px) scale(.9)}}
@keyframes icDrag{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}
@keyframes icUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pillPulse{50%{transform:scale(1.05)}}
.cue-pill{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:44px;padding:.5rem 1.15rem .5rem .9rem;border-radius:999px;background:rgba(255,252,244,.95);color:var(--forest);border:1.5px solid var(--pink);box-shadow:0 4px 18px rgba(26,61,40,.28);font:600 clamp(14px,4cqw,17px)/1.15 var(--f-date);letter-spacing:.05em;text-transform:none;text-shadow:none;-webkit-text-stroke:0;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cue-pill b{font-weight:inherit}
#hint{margin-top:1.6rem;letter-spacing:0;text-transform:none}#hint.ready{opacity:1}
#hintG{text-shadow:none;bottom:max(1.6rem,calc(env(safe-area-inset-bottom) + 1rem))}
#hintG.show{animation:petalFadeIn 1.2s ease-out both}
.petal-hint{text-shadow:none}.petal-hint.show{animation:petalPromptEntrance 1.4s ease-out both}
#hintG.show .cue-pill,.petal-hint.show .cue-pill,.star-hint .cue-pill,.det-btn.show,#tapBegin.show{animation:pillPulse 2s ease-in-out infinite}
.det-btn{position:absolute;left:50%;bottom:max(5.4rem,calc(env(safe-area-inset-bottom) + 4.5rem));transform:translateX(-50%);z-index:25;opacity:0;pointer-events:none;transition:opacity .5s}
.det-btn.show{opacity:1;pointer-events:auto}.scene.dim .det-btn{opacity:0!important;pointer-events:none}
.replay-btn{margin-top:1.4rem;pointer-events:auto}
/* next / back: big, solid, always visible */
.next-cue,.back-cue{bottom:max(1.4rem,calc(env(safe-area-inset-bottom) + .9rem))!important;display:flex!important;flex-direction:row!important;align-items:center;gap:.45rem!important;width:auto!important;height:auto!important;min-height:44px;padding:.4rem 1rem!important;border-radius:999px;background:rgba(255,252,244,.95)!important;color:var(--forest)!important;border:1.5px solid var(--pink)!important;box-shadow:0 4px 16px rgba(26,61,40,.3);opacity:1!important;font:600 clamp(13px,3.7cqw,16px)/1 var(--f-date)!important;letter-spacing:.05em;text-transform:none;text-shadow:none!important}
.next-cue-label{color:inherit!important;text-shadow:none!important}
.back-cue svg{width:18px;height:18px}
/* progress bar + persistent tap guide */
#prog{position:absolute;z-index:60;pointer-events:none;opacity:0;transition:opacity .4s}
#prog{top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:4px}
#app.on~#prog{opacity:1}
#prog i{flex:1;display:block;height:2px;border-radius:1px;overflow:hidden;background:rgba(26,61,40,.35);box-shadow:0 0 0 .5px rgba(255,255,255,.5)}
#prog b{display:block;height:100%;width:0;background:#fff;transition:width .5s}
#prog .done b{width:100%}#prog .now b{width:100%;background:var(--pink);box-shadow:0 0 6px var(--pink)}
/* logo screen extras */

<script>
/* ================= EDIT THIS SECTION ================= */
const CONSTELLATION_API = "https://script.google.com/macros/s/AKfycbzVGBOLdb_vjlJfURxCMwrg0lEQxKmp4sEYgd09NQxZIrC6abiqPkRKULaBExR1G7O-/exec";
const ADMIN_TOKEN = "CHANGE_THIS_TO_A_PRIVATE_ADMIN_TOKEN"; // Must match the token configured in your Apps Script.
const SIDE=new URLSearchParams(location.search).get('side')?.toLowerCase()==='groom'?'groom':'bride';
document.documentElement.dataset.side=SIDE;document.documentElement.classList.add(SIDE+'-side');
const SIDES={
  bride:{
    logo:"assets/logo.png", ganeshay:"assets/ganeshay.png",

    main:{
      beforeHosts:["With the blessings of","Smt. Sarmishtha & Shri Ramesh Doshi","and the loving memories of","Late Smt. Kamal & Late Shri Vasudeo Jatkar"],

};
const SD=SIDES[SIDE];
const CONFIG={
  logo:SD.logo,
  ganpati:"assets/ganpati.png",
  tree:"assets/Ganpati%20Tree.png",   // SVG fallback is drawn if this file is missing
  hibiscus:"assets/hibiscus.png",
  petal:"assets/petal.png",
  drawTree:true,
  flowerPos:[[22,58],[60,66],[45,77],[32,71],[55,48]],
  bg:{main:"assets/bg-main.jpg",puja:"assets/bg-puja.jpg",gpuja:"assets/Groom-bg-haldi.jpg",mehendi:"assets/bg-mehendi.jpg",sangeet:"assets/bg-sangeet.jpg",haldi:"assets/bg-haldi.jpg",wedding:"assets/bg-wedding.jpg"}
};
const EVENTS={
  puja:{always:true,bappa:true,title:"Grahamak & Mandap Mahurat",date:"wednesday, 09th december 2026",time:"9:00 AM onwards",venue:"Family Residence, Mumbai",map:"https://maps.app.goo.gl/QoJoFGFY6zFpY6jb7"},
  mehendi:{title:"Mehendi te Vaavi",date:"thursday, 10th december 2026",time:"5:00 PM onwards",venue:"Family Residence, Mumbai",map:"https://maps.app.goo.gl/QoJoFGFY6zFpY6jb7"},
  sangeet:{title:"Sagai &<br>Shor Sharaba",date:"friday, 11th december 2026",time:"7:00 PM onwards",venue:"Embassy Hall, The Tunga Paradise, Andheri E, Mumbai",map:"https://maps.app.goo.gl/GceAwj1eoHQRVYf56"},
  gpuja:{skin:"puja",title:"Prem Pithi",date:"saturday, 12th december 2026",time:"10:00 AM onwards",venue:"Orchid Hall, Lodha Eternis",map:"https://maps.app.goo.gl/JrvUhVTGP5fqonHS8"},
  haldi:{title:"Prem Pithi",date:"saturday, 12th december 2026",time:"05:00 PM onwards",venue:"Family Residence, Mumbai",map:"https://maps.app.goo.gl/QoJoFGFY6zFpY6jb7"},
  wedding:{always:true,title:"Mangal Pheras",date:"sunday, 13th december 2026",time:"Jaan Agaman: 10:30 AM<br>Hasta Melap: 12:30 PM",venue:"Grande Hall C, NESCO, Goregaon E, Mumbai",map:"https://maps.app.goo.gl/tzmzjRDrhJN4GLGJ7"}
};
if(SIDE==='bride')Object.assign(EVENTS.gpuja,{time:"05:00 PM onwards",venue:"Family Residence, Mumbai",map:"https://maps.app.goo.gl/QoJoFGFY6zFpY6jb7"});

  /* Yellow petals on the bride Puja page. size = half of the wedding petals (24-52px) */
const YELLOW={imgs:['assets/yellow-1.png','assets/yellow-2.png'],size:[12,26]};
/* Mehendi bells: loop timing. pop = delay of the bounce-in, swing = when each bell joins the up/down loop */

const BELL_SCALE=.0275; // 30% smaller than the current .125 scale
const MBELL=[
  {img:'assets/Bell-1.png',pop:0,swing:0},
  {img:'assets/Bell-2.png',pop:.12,swing:.8},
  {img:'assets/Bell-3.png',pop:.24,swing:1.6}
];

/* ===================================================== */

/* ---- preload: key assets first (gate page 1), everything else quietly after ---- */
const loadImg=u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>r();i.src=u;if(i.decode)i.decode().then(r,r)});
const FONTS_READY=Promise.all(["1em MiltonOne","1em CinzelInvite","1em BodoniVenue"].map(f=>document.fonts.load(f).catch(()=>{})));
const CRITICAL=Promise.all([FONTS_READY,...[CONFIG.bg.main,CONFIG.ganpati,CONFIG.tree,CONFIG.hibiscus,SD.ganeshay,CONFIG.logo].map(loadImg)]);
CRITICAL.then(()=>Promise.all([...SD.order.map(k=>CONFIG.bg[k]),CONFIG.petal,...YELLOW.imgs,...MBELL.map(b=>b.img),'assets/l-wedding-bells.png','assets/R1-wedding-bells.png','assets/R2-wedding-bells.png'].filter(Boolean).map(loadImg)));

const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);
let stage='logo',cur=0,guest='',popOpen=false,locked=false,filled=false,scenes=[],PETAL=0,FINAL=0,ps=null,introTimer=null,introTrailTimer=null,introPromptShown=false,finalReturnTimer=null;
let pts=[],drawing=false,down=null;
const app=$('#app'),li=$('#logoImg'),frameEl=$('.frame');
const inFrame=e=>{const r=frameEl.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};

/* ---- pixie dust (canvas clipped to the phone frame) ---- */
const cv=$('#dust'),cx=cv.getContext('2d');
let P=[],dpr=Math.min(devicePixelRatio||1,2);
function clipDust(){
  const f=frameEl.getBoundingClientRect(),rad=parseFloat(getComputedStyle(frameEl).borderRadius)||0;
  cv.style.clipPath=`inset(${f.top}px ${innerWidth-f.right}px ${innerHeight-f.bottom}px ${f.left}px round ${rad}px)`;
}
function rs(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);clipDust()}
rs();addEventListener('resize',rs);
function dust(x,y,o={}){
  if(P.length>350)return;
  const n=o.n||3;
  for(let i=0;i<n;i++)P.push({x:x+rnd(-1,1)*(o.j??3),y:y+rnd(-1,1)*(o.j??3),vx:rnd(-.3,.3)*(o.spread||1),vy:rnd(-.35,.15)*(o.spread||1),l:0,m:o.tiny?rnd(55,120):rnd(40,85),s:o.tiny?rnd(.6,1.7):rnd(1.2,2.8),a:o.faint?.38:1,ph:rnd(0,6)});
}
const burst=(x,y,n=50,o={})=>dust(x,y,{...o,n,spread:o.spread||4});
function offeringPixieDust(){
  const flowers=[...document.querySelectorAll('#s0 .flower')],target=$('#drop');
  if(cur!==0||!flowers.length||!target)return;
  const tr=target.getBoundingClientRect(),tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;
  flowers.forEach((f,index)=>{
    const r=f.getBoundingClientRect(),sx=r.left+r.width/2,sy=r.top+r.height/2;
    for(let step=1;step<=14;step++){
      const t=step/16,x=sx+(tx-sx)*t,y=sy+(ty-sy)*t;
      setTimeout(()=>{
        if(cur!==0)return;
        const sp=document.createElement('span');
        sp.className='offer-sparkle';
        sp.style.cssText=`left:${x}px;top:${y}px;--dx:${tx-x}px;--dy:${ty-y}px;animation-duration:.95s`;
        document.body.appendChild(sp);
        sp.addEventListener('animationend',()=>sp.remove(),{once:true});
      },step*55+index*100);
    }
  });
}
let dustDirty=false;
(function loop(){
  if(!cx)return;
  if(!P.length&&!dustDirty){requestAnimationFrame(loop);return}
  dustDirty=P.length>0;
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.l++;
    if(p.l>p.m){P.splice(i,1);continue}
    p.x+=p.vx;p.y+=p.vy+.04;p.vx*=.985;
    const t=p.l/p.m;
    cx.globalAlpha=Math.max(p.a*(t<.5?1:1-(t-.5)*1.7)*(.65+.35*Math.sin(p.l*.4+p.ph)),0);
    cx.fillStyle=t>.55?'#FFE9A8':'#E8B84A';cx.shadowColor='#E8B84A';cx.shadowBlur=t>.55?3:10;
    cx.beginPath();cx.arc(p.x,p.y,Math.max(p.s*(1-t*.6),.4),0,6.283);cx.fill();
  }
  cx.globalAlpha=1;requestAnimationFrame(loop);
})();

/* ---- logo fades in and floats; infinity prompt follows ---- */

/* ---- infinity gesture ---- */
function isInfinity(){
  if(pts.length<25)return false;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),w=x1-x0,h=y1-y0;
  if(w<110||h<w*.18||h>w*.95)return false;
  const mx=(x0+x1)/2;let L=0,R=0;
  for(let i=1;i<pts.length-1;i++){
    const a={x:pts[i].x-pts[i-1].x,y:pts[i].y-pts[i-1].y},c={x:pts[i+1].x-pts[i].x,y:pts[i+1].y-pts[i].y};
    const ang=Math.atan2(a.x*c.y-a.y*c.x,a.x*c.x+a.y*c.y);
    if(pts[i].x<mx)L+=ang;else R+=ang;
  }
  return Math.abs(L)>2.2&&Math.abs(R)>2.2&&L*R<0;
}
let openLogged=false,entering=false;
function logOpen(){
  if(openLogged||!guest)return;openLogged=true;
  try{fetch(CONSTELLATION_API,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'logOpen',guest,side:SIDE,device:/iPhone|iPad/.test(navigator.userAgent)?'iPhone/iPad':/Android/.test(navigator.userAgent)?'Android':'Desktop',screen:innerWidth+'x'+innerHeight})}).catch(()=>{})}catch(e){}
}
async function enterScenes(){
  if(entering)return;entering=true;

}
function infinityDone(){
  drawing=false;

  if(guest){enterScenes();return}            // returning guest: skip the name form

}

/* ---- builders ---- */

function textRects(el){
  if(!el)return [];
  const rg=document.createRange();rg.selectNodeContents(el);
  return [...rg.getClientRects()].filter(r=>r.width>2&&r.height>2);
}
/* blocked areas: the actual text lines, map link, and both navigation buttons */
function starGeo(scene){
  const sr=scene.getBoundingClientRect(),rects=[];
  scene.querySelectorAll('.ev-over h2,.ev-over p,.ev-over .tg').forEach(el=>textRects(el).forEach(r=>rects.push({l:r.left,r:r.right,t:r.top,b:r.bottom,pad:14})));
  const heading=scene.querySelector('.constellation-heading');
  /* Keep stars clear of the prompt itself, but allow them to fill the space above it. */
  if(heading)textRects(heading).forEach(r=>rects.push({l:r.left,r:r.right,t:r.top,b:r.bottom,pad:12}));
  let mapFloor=null;
  [['.ev-over .maplink',24],['.next-cue',28],['.back-cue',36]].forEach(([sel,pad])=>{
    const el=scene.querySelector(sel);
    if(el){const r=el.getBoundingClientRect();rects.push({l:r.left,r:r.right,t:r.top,b:r.bottom,pad});if(sel==='.ev-over .maplink')mapFloor=r.bottom+12}
  });
  return {sr,rects,mapFloor};
}
function starBlocked(g,px,py){
  const sx=g.sr.left+g.sr.width*px/100,sy=g.sr.top+g.sr.height*py/100;
  /* No constellation stars are placed below the map link. */
  if(g.mapFloor!==null&&sy>g.mapFloor)return true;
  return g.rects.some(o=>sx>=o.l-o.pad&&sx<=o.r+o.pad&&sy>=o.t-o.pad&&sy<=o.b+o.pad);
}
/* 200 stars exist; each guest sees 75 at a time and the set keeps quietly changing. */
const STAR_POOL=200,STAR_VISIBLE=75,STAR_SWAP_EVERY=2600,STAR_SWAP_COUNT=3;
const starNum=id=>parseInt(String(id).replace(/\D/g,''),10)||0;
const starDef=n=>{const f=STAR_FORTUNES[(n-1)%STAR_FORTUNES.length];return{id:starId(n),category:f.category,fortune:f.fortune}};
const lsSafe={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const myStarKey=()=>'inviteMyStar:'+(typeof SIDE!=='undefined'?SIDE:'')+':'+String(guest||'guest').toLowerCase();
let myStar=null;   // newest sealed star {id,x,y,wish}: the brightest one
let oldStars=[];   // earlier sealed stars: kept, golden, smaller
const saveMyStar=()=>{if(myStar)lsSafe.set(myStarKey(),JSON.stringify({...myStar,old:oldStars}))};
const isOldId=id=>oldStars.some(o=>o.id===id);
const posOf=el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)});
const liveStars=layer=>[...layer.querySelectorAll('.constellation-star:not(.is-leaving)')];

function randomStarPosition(existing,scene,geo){
  geo=geo||starGeo(scene);
  const W=geo.sr.width,H=geo.sr.height;
  let min=52;
  /* Seed the first stars into the open top and lower-middle bands so those areas do not stay empty. */
  const zone=existing.length<10?'top':existing.length<20?'bottom':'all';
  const sample=()=>{const x=4+Math.random()*92;let y;if(zone==='top')y=3+Math.random()*11;else if(zone==='bottom')y=82+Math.random()*12;else y=3+Math.random()*94;return{x,y}};
  for(let round=0;round<4;round++,min*=.85){
    for(let t=0;t<260;t++){
      const {x,y}=sample();
      if(starBlocked(geo,x,y))continue;
      if(existing.some(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Math.hypot((p.x-x)*W/100,(p.y-y)*H/100)<min))continue;
      return {x,y};
    }
  }
  for(let t=0;t<400;t++){const x=4+Math.random()*92,y=3+Math.random()*94;if(!starBlocked(geo,x,y))return {x,y}}
  return {x:50,y:50};
}
function pickStarNum(layer){
  const used=new Set([...layer.querySelectorAll('.constellation-star')].map(el=>starNum(el.dataset.starId)));
  const free=[];
  for(let n=1;n<=STAR_POOL;n++)if(!used.has(n))free.push(n);
  return free.length?free[Math.floor(Math.random()*free.length)]:0;
}
function relayoutStars(scene){
  const layer=scene.querySelector('.constellation-layer');if(!layer)return;
  const geo=starGeo(scene);layer._geo=geo;
  const stars=[...layer.querySelectorAll('.constellation-star')];
  stars.forEach(el=>{
    const q=posOf(el);
    if(!starBlocked(geo,q.x,q.y))return;
    const pos=randomStarPosition(stars.filter(o=>o!==el).map(posOf),scene,geo);
    el.style.left=pos.x+'%';el.style.top=pos.y+'%';
    if(el._star){el._star.x=pos.x;el._star.y=pos.y}
    if(myStar&&el.dataset.starId===myStar.id){myStar.x=pos.x;myStar.y=pos.y;saveMyStar()}     else{const o=oldStars.find(o=>o.id===el.dataset.starId);if(o){o.x=pos.x;o.y=pos.y;saveMyStar()}}
  });
}
function setMineEl(el){
  const layer=el.closest('.constellation-layer');

  el.classList.remove('is-dim','is-entering','is-old','is-other-claimed');
  el.classList.add('is-gold','is-mine','is-size-4');
  el.style.removeProperty('--big');
  el.style.setProperty('--star-size','10px');
  el.setAttribute('aria-label','Your star. See the wish you sent.');
  myConstellationStars.add(el.dataset.starId);

  /* Keep the claimed star biggest and give another unclaimed star the smallest size. */
  if(layer){
    const replacement=liveStars(layer).find(s=>
      s!==el &&
      !s.classList.contains('is-mine') &&
      !s.classList.contains('is-old') &&
      !s.classList.contains('is-other-claimed') &&
      !s.classList.contains('is-leaving') &&
      !s.classList.contains('is-size-1')
    );

    if(replacement){
      replacement.classList.remove('is-size-2','is-size-3','is-size-4');
      replacement.classList.add('is-size-1');
    }
  }
}
function setOldEl(el){el.classList.remove('is-dim','is-entering','is-mine','is-other-claimed');el.classList.add('is-gold','is-old');el.style.removeProperty('--big');el.setAttribute('aria-label','A star you sealed a wish on.');}
function removeStarEl(el){
  if(el.classList.contains('is-leaving'))return;
  el.classList.add('is-leaving');setTimeout(()=>el.remove(),1000);
}
function topUpStars(scene){
  const layer=scene.querySelector('.constellation-layer');if(!layer)return;
  const geo=starGeo(scene);layer._geo=geo;
  let live=liveStars(layer);
  while(live.length>STAR_VISIBLE){
    const cand=live.filter(el=>!el.classList.contains('is-mine')&&!el.classList.contains('is-old'));if(!cand.length)break;
    const el=cand[Math.floor(Math.random()*cand.length)];removeStarEl(el);live=live.filter(o=>o!==el);
  }
  while(live.length<STAR_VISIBLE){
    const n=pickStarNum(layer);if(!n)break;
    const pos=randomStarPosition([...layer.querySelectorAll('.constellation-star')].map(posOf),scene,geo);
    live.push(addConstellationStar(layer,{...starDef(n),x:pos.x,y:pos.y},scene));
  }
}
function swapStars(layer,scene){
  const ui=layer.querySelector('.constellation-ui');
  if(ui&&ui.classList.contains('open'))return;
  const geo=starGeo(scene);layer._geo=geo;
  const cands=liveStars(layer).filter(el=>!el.classList.contains('is-mine')&&!el.classList.contains('is-old')&&!el.classList.contains('is-other-claimed')&&!el.classList.contains('is-entering'));
  for(let k=0;k<STAR_SWAP_COUNT&&cands.length;k++){
    const el=cands.splice(Math.floor(Math.random()*cands.length),1)[0];
    removeStarEl(el);
    const n=pickStarNum(layer);if(!n)continue;
    const pos=randomStarPosition([...layer.querySelectorAll('.constellation-star')].map(posOf),scene,geo);
    addConstellationStar(layer,{...starDef(n),x:pos.x,y:pos.y},scene);
  }
}
function makeConstellation(scene){

  layer.innerHTML=`<div class="constellation-heading">Choose a star, Leave a wish</div>`;

   myStar=null;oldStars=[];
  try{const m=JSON.parse(lsSafe.get(myStarKey())||'null');if(m&&m.id){oldStars=Array.isArray(m.old)?m.old:[];delete m.old;myStar=m;takenConstellationStars.add(m.id)}}catch(e){}
  const geo=starGeo(scene);layer._geo=geo;
  const placed=[];
  if(myStar){
    if(myStar.x==null||starBlocked(geo,myStar.x,myStar.y)){const q=randomStarPosition(placed,scene,geo);myStar.x=q.x;myStar.y=q.y;saveMyStar()}

    setOldEl(addConstellationStar(layer,{...starDef(starNum(o.id)),x:o.x,y:o.y},scene,{instant:true}));
  });
  while(liveStars(layer).length<STAR_VISIBLE){
    const n=pickStarNum(layer);if(!n)break;
    const pos=randomStarPosition(placed,scene,geo);placed.push(pos);

  }

  ui.innerHTML='<div class="constellation-card"><h3>Your little fortune</h3><p class="star-fortune"></p><p class="star-category" hidden></p><textarea maxlength="500" aria-label="Your wish (optional)" placeholder="Whisper a wish for yourself…"></textarea><div class="constellation-actions"><button type="button" class="constellation-seal">Keep this fortune ✨</button><button type="button" class="constellation-cancel">Close</button></div><p class="constellation-status" aria-live="polite"></p></div>';
  [ui,ui.querySelector('.constellation-card')].forEach(el=>{el.addEventListener('pointerdown',e=>e.stopPropagation());el.addEventListener('pointerup',e=>e.stopPropagation())});
  ui.addEventListener('click',e=>{if(e.target===ui)closeConstellationWish(ui)});
  ui.querySelector('.constellation-cancel').addEventListener('click',()=>closeConstellationWish(ui));
  ui.querySelector('.constellation-seal').addEventListener('click',()=>saveConstellationWish(scene,ui));
  layer.appendChild(ui);
  if(new URLSearchParams(location.search).has('admin'))addConstellationAdmin(scene,layer);
  /* keep reshuffling which 75 of the 200 are shown */
  layer._timer=setInterval(()=>{
    if(!layer.isConnected){clearInterval(layer._timer);return}
    if(document.hidden||stage!=='scenes'||!scene.classList.contains('active')||scene.classList.contains('leaving'))return;
    swapStars(layer,scene);
  },STAR_SWAP_EVERY);
  loadConstellationStars(scene);
}
function addConstellationStar(layer,star,scene,opt={}){
  const b=document.createElement('button');
  b.type='button';
  b.className='constellation-star';
  b.dataset.starId=star.id;
  b.dataset.category=star.category;

  /* Exact 40/30/20/10 size distribution across each group of ten IDs. */
  const sizeSlot=((starNum(star.id)-1)%10)+1;
  const sizeClass=sizeSlot<=4?'is-size-1':
                  sizeSlot<=7?'is-size-2':
                  sizeSlot<=9?'is-size-3':'is-size-4';
  b.classList.add(sizeClass);

  b.style.cssText=`left:${star.x}%;top:${star.y}%;--twinkle:${(2+Math.random()*2.2).toFixed(2)}s;animation-delay:${(-Math.random()*4).toFixed(2)}s`;

  if(Math.random()<.67)b.classList.add('is-dim');

  b.innerHTML=starShape;
  b.setAttribute('aria-label','Open a star. Claim the fortune.');
  b._star=star;

  b.addEventListener('pointerdown',e=>e.stopPropagation());
  b.addEventListener('pointerup',e=>e.stopPropagation());
  b.addEventListener('click',e=>{
    e.stopPropagation();
    activeConstellationStar=star;
    openConstellationWish(scene||layer.closest('.scene'));
  });

  if(!opt.instant)b.classList.add('is-entering');
  layer.appendChild(b);

  if(!opt.instant){
    requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.remove('is-entering')));
  }
  return b;
}
function openConstellationWish(scene){
  const ui=scene.querySelector('.constellation-ui');
  if(!ui||!activeConstellationStar)return;

  const oldRec=oldStars.find(o=>o.id===activeConstellationStar.id);
  const mine=!!(myStar&&activeConstellationStar.id===myStar.id)||!!oldRec;
  const rec=oldRec||myStar;
  const ta=ui.querySelector('textarea');
  const categoryLine=ui.querySelector('.star-category');

  ui.querySelector('h3').textContent=mine?'Your star':'Your little fortune';
  ui.querySelector('.star-fortune').textContent=activeConstellationStar.fortune;

  categoryLine.textContent=mine
    ?`A star of ${activeConstellationStar.category.toLowerCase()}.`
    :'';
  categoryLine.hidden=!mine;

  ta.value=mine?(rec.wish||''):'';
  ta.readOnly=mine;
  ui.querySelector('.constellation-seal').style.display=mine?'none':'';
  ui.querySelector('.constellation-status').textContent=mine
    ?(oldRec?'Your wish is shining for the couple ✨':'Your wish is shining brightest for the couple ✨')
    :'';

  ui.classList.add('open');
  if(!mine)setTimeout(()=>ta.focus({preventScroll:true}),100);
}
function closeConstellationWish(ui){ui.classList.remove('open');activeConstellationStar=null}
/* make `id` this guest's one brightest star (an earlier one is retired) */
function setMyStar(id,wish){
  const same=myStar&&myStar.id===id;
  if(!same){
    if(myStar&&!isOldId(myStar.id))oldStars.push({...myStar});   // previous bright star is kept, just smaller
    const back=oldStars.find(o=>o.id===id);
    oldStars=oldStars.filter(o=>o.id!==id);
    myStar=back?{...back}:{id,x:null,y:null,wish:''};
  }
  if(wish)myStar.wish=wish;
  document.querySelectorAll('.constellation-star').forEach(el=>{
    if(el.dataset.starId===id){setMineEl(el);const q=posOf(el);myStar.x=q.x;myStar.y=q.y}
    else if(el.classList.contains('is-mine'))setOldEl(el);
  });
  takenConstellationStars.add(id);saveMyStar();
}
function ensureMyStar(scene){
  const layer=scene.querySelector('.constellation-layer');if(!layer||!myStar)return;
  const geo=starGeo(scene);
  const place=(rec,mark)=>{
    if(layer.querySelector(`.constellation-star[data-star-id="${rec.id}"]:not(.is-leaving)`))return;
    if(rec.x==null||starBlocked(geo,rec.x,rec.y)){const q=randomStarPosition([...layer.querySelectorAll('.constellation-star')].map(posOf),scene,geo);rec.x=q.x;rec.y=q.y}
    mark(addConstellationStar(layer,{...starDef(starNum(rec.id)),x:rec.x,y:rec.y},scene));
  };
  oldStars.forEach(o=>place(o,setOldEl));
  place(myStar,setMineEl);
  saveMyStar();
}
function refreshOtherClaimedStars(scene){
  const layer=scene&&scene.querySelector('.constellation-layer');if(!layer)return;
  const ownIds=new Set([myStar&&myStar.id,...oldStars.map(o=>o.id)].filter(Boolean));
  const ids=[...otherClaimedStarIds].filter(id=>!ownIds.has(id)).slice(0,OTHER_CLAIMED_VISIBLE);
  const wanted=new Set(ids);
  layer.querySelectorAll('.constellation-star.is-other-claimed').forEach(el=>{
    if(!wanted.has(el.dataset.starId))el.classList.remove('is-other-claimed');
  });
  const geo=starGeo(scene);
  ids.forEach(id=>{
    let el=layer.querySelector(`.constellation-star[data-star-id="${id}"]:not(.is-leaving)`);
    if(!el){
      const candidates=liveStars(layer).filter(o=>!o.classList.contains('is-mine')&&!o.classList.contains('is-old')&&!o.classList.contains('is-other-claimed'));
      if(liveStars(layer).length>=STAR_VISIBLE&&candidates.length)removeStarEl(candidates[Math.floor(Math.random()*candidates.length)]);
      const pos=randomStarPosition([...layer.querySelectorAll('.constellation-star')].map(posOf),scene,geo);
      el=addConstellationStar(layer,{...starDef(starNum(id)),x:pos.x,y:pos.y},scene,{instant:true});
    }
    el.classList.add('is-other-claimed');
    el.setAttribute('aria-label',`${el.dataset.category} star. A wish has been left here; you can still open it.`);
  });
  topUpStars(scene);
}
function markConstellationStar(id,owner,wish){
  const mine=owner&&guest&&owner.toLowerCase()===guest.toLowerCase();
  takenConstellationStars.add(id);
  if(mine){setMyStar(id,wish);return}
  if(id&&!(myStar&&myStar.id===id)&&!isOldId(id))otherClaimedStarIds.add(id);
  /* Other guests' claims are highlighted, but stars remain selectable. */
}
function loadConstellationStars(scene){
  if(!CONSTELLATION_API||CONSTELLATION_API.includes('YOUR_DEPLOYMENT_ID'))return;
  window.receiveConstellationStars=data=>{

function tone(f,t0,dur,vol){

}

/*
  Wait until all three Puja bell images have either loaded or failed, then
  restart their entrance animations together. This prevents cached/fast-loading
  images from bouncing while slower images miss the animation entirely.
*/
function bouncePujaBells(scene){
  if(!scene) return;
  const bells=Array.from(scene.querySelectorAll('.w-bell'));
  if(bells.length!==3) return;

  const token=(scene._pujaBellBounceToken||0)+1;
  scene._pujaBellBounceToken=token;
  const images=bells.map(bell=>bell.querySelector('img')).filter(Boolean);

  Promise.all(images.map(img=>new Promise(resolve=>{
    if(img.complete){resolve();return;}
    img.addEventListener('load',resolve,{once:true});
    img.addEventListener('error',resolve,{once:true});
  }))).then(()=>{
    if(scene._pujaBellBounceToken!==token||!scene.classList.contains('active')) return;

    bells.forEach((bell,index)=>{
      const img=bell.querySelector('img');
      if(!img) return;
      img.classList.remove('is-bouncing');
      img.style.setProperty('--bounce-delay',`${index*0.16}s`);
      img.style.animation='none';
      void img.offsetWidth;
      img.style.removeProperty('animation');
      img.classList.add('is-bouncing');
    });
  });
}

let lastGo=0;
function go(i){

function canonicalEventKey(value){
  const raw=String(value??'').trim().toLowerCase();
  const compact=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
  if(!compact)return null;
 if(compact==='puja'&&SIDE==='groom')return 'gpuja';

function wireFlower(f){
  let sx,sy,tx=0,ty=0,origin=null;

  const T=sc=>
    `translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(var(--rot,0deg)) scaleX(var(--flip,1)) scale(${sc})`;

  f.addEventListener('pointerdown',e=>{
    if(locked)return;
    e.stopPropagation();

    const r=f.getBoundingClientRect();
    origin={
      parent:f.parentNode,
      next:f.nextSibling,
      position:f.style.position,
      left:f.style.left,
      top:f.style.top,
      width:f.style.width,
      height:f.style.height,
      margin:f.style.margin,
      zIndex:f.style.zIndex,
      transform:f.style.transform,
      opacity:f.style.opacity,
      transition:f.style.transition

    sx=e.clientX;
    sy=e.clientY;
    tx=ty=0;

    /* Lift only the dragged flower out of the scene's stacking layer. */
    document.body.appendChild(f);
    f.style.position='fixed';
    f.style.left=(r.left+r.width/2)+'px';
    f.style.top=(r.top+r.height/2)+'px';
    f.style.width=r.width+'px';
    f.style.height=r.height+'px';
    f.style.margin='0';
    f.style.zIndex='2147483647';
    f.style.transition='none';
    f.style.transform='';
    f.classList.add('drag');

    f.setPointerCapture(e.pointerId);
  });

  f.addEventListener('pointermove',e=>{
    if(!f.classList.contains('drag'))return;
    tx=e.clientX-sx;
    ty=e.clientY-sy;
    f.style.transform=T(1.25);
    dust(e.clientX,e.clientY,{n:2,faint:true});
  });

  f.addEventListener('pointerup',e=>{
    e.stopPropagation();
    if(!f.classList.contains('drag')||!origin)return;

    f.classList.remove('drag');

    const d=$('#drop').getBoundingClientRect();
    const dx=d.left+d.width/2;
    const dy=d.top+d.height/2;

    if(Math.hypot(e.clientX-dx,e.clientY-dy)<d.width*.8&&!locked){
      locked=true;
      burst(dx,dy,60,{spread:5});
      /* Keep this flower absent from the pool until the main page has scrolled away. */
      flyFlowerToBappa(f,()=>{
        pendingFlowerReturn=()=>{
          const o=origin;
          if(!o)return;
          o.parent.insertBefore(f,o.next&&o.next.parentNode===o.parent?o.next:null);
          f.style.position=o.position;
          f.style.left=o.left;
          f.style.top=o.top;
          f.style.width=o.width;
          f.style.height=o.height;
          f.style.margin=o.margin;
          f.style.zIndex=o.zIndex;
          f.style.transform=o.transform;
          f.style.opacity=o.opacity;
          f.style.transition=o.transition;
          tx=ty=0;
          origin=null;
        };
      });
    }else{
      /* Return the flower to its original place if the drop misses. */
      const o=origin;
      o.parent.insertBefore(
        f,
        o.next&&o.next.parentNode===o.parent?o.next:null
      );

      f.style.position=o.position;
      f.style.left=o.left;
      f.style.top=o.top;
      f.style.width=o.width;
      f.style.height=o.height;
      f.style.margin=o.margin;
      f.style.zIndex=o.zIndex;
      f.style.transform=o.transform;
      f.style.opacity=o.opacity;
      f.style.transition=o.transition;

      tx=ty=0;
      origin=null;
    }
  });
}

function flyFlowerToBappa(f,onLand){
  const bp=$('#bappa'),bf=bp.querySelector('.gflower');
  const r=f.getBoundingClientRect(),t=bf.getBoundingClientRect();
  const sx=r.left+r.width/2,sy=r.top+r.height/2,ex=t.left+t.width/2,ey=t.top+t.height/2,dx=ex-sx,dy=ey-sy;

    {transform:`translate(0,0) scale(${r.width/t.width})`},

  requestAnimationFrame(demo);
  const sc=scenes[0],dr=$('#drop');
  const on=!RM&&stage==='scenes'&&cur===0&&introPromptShown&&!locked&&!popOpen&&sc&&sc.classList.contains('active')&&dr&&!document.querySelector('.flower.drag');
  const f=on&&[...sc.querySelectorAll('.flower:not(.drag)')].find(x=>+getComputedStyle(x).opacity>.5&&x.offsetWidth>0);
  if(!f){gd.style.opacity=0;d0=0;return}
  if(!d0)d0=ts;
  const T=2000,t=(ts-d0)%3400;
  if(t>T){gd.style.opacity=0;return}
  const a=f.getBoundingClientRect(),b=dr.getBoundingClientRect(),p=t/T,e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  const ax=a.left+a.width/2,ay=a.top+a.height/2,x=ax+(b.left+b.width/2-ax)*e,y=ay+(b.top+b.height/2-ay)*e;
  gd.style.opacity=p<.1?p*10:p>.9?(1-p)*10:1;
  gd.style.transform=`translate(${x-19}px,${y-19}px)`;
  dust(x,y,{n:1,tiny:true,spread:.5});
})(0);

/* returning guest: skip intro + resume where they left off */
let sv=null;try{sv=JSON.parse(ls.get(KEY)||'null')}catch(e){}
if(sv&&sv.guest){
  guest=sv.guest;guestDisplay=sv.display||'';guestEvents=sv.events||[];
  const w=document.createElement('div');w.id='welcomeBack';
  const sp=document.createElement('span');sp.textContent='Welcome back, '+(sv.display||sv.guest);
  const sk=document.createElement('button');sk.type='button';sk.className='cue-pill';sk.id='skipIntro';sk.innerHTML='<b>Skip intro</b>';
  const ny=document.createElement('button');ny.type='button';ny.className='linkbtn';ny.textContent='Not you?';
  w.append(sp,sk,ny);logoEl.appendChild(w);
  ['pointerdown','pointerup'].forEach(v=>w.addEventListener(v,e=>e.stopPropagation()));
  sk.addEventListener('click',async()=>{
    manual=true;
    try{await enterScenes();const pg=scenes.findIndex(s=>s.dataset.key==='sangeet');go(pg>0?pg:1)}catch(e){}
  });
  ny.addEventListener('click',()=>{guest='';guestDisplay='';guestEvents=[];ls.del(KEY);ls.del(PKEY);w.remove()});
}
})();
</script>
