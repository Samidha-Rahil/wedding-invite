<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited</title>
<style>
/* ===== FONTS (files live in assets/font/) ===== */
@font-face{font-family:'MiltonOne';src:url('assets/font/milton-one.one.otf') format('opentype');font-display:swap}
@font-face{font-family:'CinzelInvite';src:url('assets/font/CinzelRegular-3jEM.ttf') format('truetype');font-display:swap}
@font-face{font-family:'BodoniVenue';src:url('assets/font/Bodoni%20SvtyTwo%20ITC%20TT%20Book.ttf') format('truetype');font-display:swap}
:root{--pink:#E38496;--forest:#1A3D28;--white:#fff;--sage:#617764;--olive:#B2AF87;--cream:#F9EDD5;
--f-names:'MiltonOne',serif;--f-date:'CinzelInvite',serif;--f-venue:'BodoniVenue',serif;--fd:'MiltonOne',serif;--fb:'CinzelInvite',serif}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--cream);color:var(--forest);font-family:var(--fb);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.frame{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,480px);transform:translateX(-50%);overflow:hidden;background:var(--cream);box-shadow:0 0 60px rgba(97,119,100,.25)}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}

/* ===== ANIMATION HELPERS ===== */
.fx{opacity:0}
.fx.l{--a:flyL}.fx.r{--a:flyR}
.scene.active:not(#s0) .fx,#nameModal.show .fx,#pop.show .fx{animation:var(--a,flyU) 1.3s cubic-bezier(.2,.8,.2,1) var(--d,.6s) both}
@keyframes flyU{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes flyL{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes flyR{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes ganpatiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ===== LOGO SCREEN ===== */
#logo{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);transition:opacity 1.2s}
#logo.gone{opacity:0;pointer-events:none}
#logoBox{width:62%;aspect-ratio:1;display:grid;place-items:center}
#logoBox img{width:100%;height:100%;object-fit:contain}
.mono{display:none;text-align:center;color:var(--pink);font-family:var(--f-names);font-size:3.4rem;line-height:1.1}
.mono small{display:block;font-size:1rem;letter-spacing:.35em;color:var(--forest);margin-top:.6rem;font-family:var(--f-date)}
#hint{margin-top:2.2rem;font-size:clamp(.9rem,3.75vw,1.2rem);letter-spacing:.15em;text-transform:uppercase;color:var(--pink);opacity:.85;animation:pulse 3s ease-in-out infinite}
#hint .inf{display:inline-block;font-size:2.2em;line-height:0;vertical-align:-.1em;margin:0 .08em}

/* ===== NAME MODAL ===== */
#nameModal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(249,237,213,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .8s}
#nameModal.show{opacity:1;pointer-events:auto}
.card{width:82%;background:var(--white);border:1px solid var(--olive);border-radius:22px;padding:2rem 1.6rem;text-align:center;box-shadow:0 18px 50px rgba(26,61,40,.18);transform:translateY(14px);transition:transform .8s}
#nameModal.show .card{transform:none}
.card h2{font-family:var(--f-names);font-weight:400;font-size:2rem;color:var(--pink)}
.card h2.welcome-word{font-family:var(--fb);letter-spacing:.06em;font-size:2.1rem}
.card p{margin:.4rem 0 1.2rem;color:var(--forest);font-family:var(--f-venue);font-size:1rem;letter-spacing:.02em}
.card input{width:100%;padding:.85rem 1rem;border:1px solid var(--olive);border-radius:12px;background:var(--cream);color:var(--forest);font:1.05rem var(--f-venue);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.card input::placeholder{color:var(--sage)}
.card input:focus{border-color:var(--pink)}
.btn{margin-top:1rem;width:100%;padding:.85rem;border:0;border-radius:12px;background:var(--pink);color:var(--white);font:.95rem var(--fb);letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== SCENES ===== */
#app{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
#app.on{opacity:1}
.scene{--hl:var(--pink);position:absolute;inset:0;background:var(--cream);transform:translateY(100%);transition:transform 1s cubic-bezier(.65,0,.25,1);overflow:hidden}
.scene.active{transform:none}
.scene.past{transform:translateY(-100%)}
.scene[data-event=mehendi],.scene[data-event=haldi]{--hl:var(--white)}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s;z-index:0}
.scene.dim img.bg{opacity:.22}
.scene[data-event=main] img.bg{object-position:left center}
.scene[data-event=puja] img.bg{object-position:center top}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;background:var(--cream);color:var(--forest);font-size:.85rem;letter-spacing:.1em;z-index:1}
.ph[hidden],.image-fallback[hidden]{display:none}
.image-fallback{position:absolute;inset:0;display:grid;place-items:center;padding:1rem;text-align:center;color:var(--forest);font-size:.85rem;letter-spacing:.04em;background:var(--cream);z-index:1}

/* ===== PAGE 1: BLESSING + OFFERING ===== */
.intro{position:absolute;top:max(4.2rem,env(safe-area-inset-top));left:8%;width:84%;z-index:6;text-align:center;color:var(--white);text-shadow:0 2px 10px rgba(26,61,40,.75);pointer-events:none}
.scene.active#s0 .intro{animation:flyU 1.3s .4s both}
.intro .eyebrow{font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;margin-bottom:.65rem}
.intro h1{font:600 clamp(1.65rem,7vw,2.35rem)/1.05 var(--f-names);color:var(--white);margin:0 auto .65rem;max-width:18ch}
.intro p{font-size:.82rem;line-height:1.5;max-width:31ch;margin:0 auto .8rem}
#hintG{position:absolute;bottom:max(1.1rem,env(safe-area-inset-bottom));left:5%;width:90%;z-index:3;text-align:center;white-space:nowrap;opacity:0;pointer-events:none;font-family:var(--fb);font-size:clamp(.9rem,3.75vw,1.2rem);letter-spacing:.08em;color:var(--pink);text-shadow:0 0 6px #fff,0 0 14px rgba(227,132,150,.95),0 0 28px rgba(227,132,150,.7),0 0 42px rgba(227,132,150,.4)}
#hintG.show{animation:petalFadeIn 1.8s ease-out both,petalGlow 2.8s 1.8s ease-in-out infinite}
#drop{position:absolute;left:50%;bottom:calc(7% - 39px);width:78px;height:78px;margin-left:-39px;border-radius:50%;border:1.5px dashed var(--white);box-shadow:0 0 20px rgba(255,255,255,.45),inset 0 0 18px rgba(227,132,150,.38);animation:pulse 2.6s infinite;z-index:6}
.tree-art{position:absolute;right:-31%;bottom:0;width:72.5%;height:65%;z-index:5;pointer-events:none;overflow:visible;transform-origin:80% 100%}
.tree-art img,.tree-art svg.t{width:100%;height:100%}
.tree-art img{object-fit:contain;object-position:bottom right}
.scene.active#s0 .tree-art{animation:treeEnter 1.8s cubic-bezier(.2,.75,.25,1) both,treeBobble 8s 1.8s ease-in-out infinite}
@keyframes treeEnter{from{opacity:0;transform:translateX(65%) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes treeBobble{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-9px) rotate(-2.4deg)}55%{transform:translateX(6px) rotate(1.8deg)}75%{transform:translateX(-5px) rotate(-1.2deg)}}
.flower{position:absolute;width:58px;height:58px;transform:translate(-50%,-50%);cursor:grab;touch-action:none;z-index:7;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35));transition:transform .35s,opacity .5s;pointer-events:auto}
.flower.drag{transition:none;cursor:grabbing;z-index:30}
.flower img,.flower svg{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}

/* ===== GANPATI + FLOWER (one element shared by pages 1 and 2) ===== */
#bappa{position:absolute;left:17%;width:66%;top:44%;height:49%;z-index:4;pointer-events:none;transition:top 1s cubic-bezier(.65,0,.25,1),height 1s cubic-bezier(.65,0,.25,1),opacity .6s}
#bappa.up{top:8%;height:46%}
#bappa.gone{opacity:0}
#bappa img.bgan{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;opacity:0;filter:drop-shadow(0 5px 10px rgba(26,61,40,.12))}
#bappa.in img.bgan{animation:flyU 1.5s .5s cubic-bezier(.2,.8,.2,1) both,ganpatiFloat 4.5s 2s ease-in-out infinite}
.bappa-flower{position:absolute;left:50%;bottom:3%;width:72px;height:72px;transform:translateX(-50%);opacity:0;transition:opacity .5s;filter:drop-shadow(0 2px 6px rgba(26,61,40,.35))}
.bappa-flower img,.bappa-flower svg{width:100%;height:100%;object-fit:contain;display:block}
#bappa.offered .bappa-flower{opacity:1;transform:translateX(-50%) rotate(45deg);animation:flowerSpin 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes flowerSpin{from{transform:translateX(-50%) rotate(-315deg) scale(.6)}to{transform:translateX(-50%) rotate(45deg) scale(1)}}

/* ===== EVENT PAGES ===== */
.ev-over{position:absolute;left:0;right:0;bottom:10%;padding:5rem 1.5rem 2.6rem;text-align:center;z-index:3;pointer-events:none;text-shadow:0 1px 5px rgba(26,61,40,.3)}
.ev-over .tg{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:var(--white)}
.ev-over h2,.ev-over p{font-weight:500;-webkit-text-stroke:.3px currentColor}
.ev-over h2{font-family:var(--f-names);font-size:5rem;line-height:1;color:var(--hl);margin:.2rem 0 .5rem;overflow-wrap:anywhere}
.ev-over p{color:var(--white);font-size:1rem;margin:.18rem 0}
.date-time,.host-names{font-family:var(--f-date)}
.venue-row{font-family:var(--f-venue)}
.maplink{display:inline-block;margin-top:.9rem;padding:.55rem 1.3rem;border:1px solid currentColor;border-radius:999px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;pointer-events:auto;cursor:pointer}
.ev-over .maplink{color:var(--white)}
.scene[data-event=puja] .ev-over p,.scene[data-event=puja] .ev-over .maplink{color:var(--sage);text-shadow:0 1px 4px rgba(249,237,213,.55)}
@media(max-width:600px){
  .ev-over{padding:3.5rem .8rem 2.2rem}
  .ev-over h2{font-size:6.5rem;line-height:.95}
  .scene[data-event=puja] .ev-over h2{font-size:4.9rem}
}
.next-cue{position:absolute;right:1.1rem;bottom:1.2rem;z-index:12;border:0;background:transparent;color:var(--hl);font:.62rem var(--f-date);letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.32rem;cursor:pointer;padding:.3rem;pointer-events:auto}
.next-cue-label{text-shadow:0 1px 5px rgba(26,61,40,.5)}
.pixie-orbit{position:relative;display:block;width:27px;height:27px;border:1px solid currentColor;border-radius:50%;animation:cuePulse 2.2s ease-in-out infinite}
.pixie-orbit::before,.pixie-orbit::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.pixie-orbit::before{top:2px;right:1px}.pixie-orbit::after{bottom:1px;left:2px}
@keyframes cuePulse{0%,100%{transform:scale(.94);opacity:.55;box-shadow:0 0 0 0 rgba(227,132,150,.18)}50%{transform:scale(1.04);opacity:1;box-shadow:0 0 0 5px rgba(227,132,150,0)}}

/* ===== WEDDING PAGE: FALLING PETALS ===== */
.petal-hint{position:absolute;top:30%;left:5%;width:90%;transform:translateY(-50%);z-index:20;text-align:center;opacity:0;pointer-events:none;font-family:var(--fb);font-size:clamp(.9rem,3.75vw,1.2rem);line-height:1.2;letter-spacing:.07em;color:var(--pink);text-shadow:0 0 8px rgba(255,255,255,.98),0 0 18px rgba(227,132,150,.95),0 0 34px rgba(227,132,150,.65)}
.petal-hint.show{animation:petalPromptEntrance 1.4s ease-out both,petalSoftGlow 3.2s 1.4s ease-in-out infinite}
.scene.dim .petal-hint{opacity:0 !important;transition:opacity .4s}
.hint-text{display:inline-block;transform-origin:center}
.hint-text.pulse{animation:hintPulse 1.6s ease-in-out 1}
@keyframes hintPulse{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(1.05)}}
@keyframes petalFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:.9;transform:none}}
@keyframes petalGlow{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes petalPromptEntrance{from{opacity:0;transform:translateY(calc(-50% + 28px))}to{opacity:1;transform:translateY(-50%)}}
@keyframes petalSoftGlow{
  0%,100%{opacity:1;text-shadow:0 0 8px rgba(255,255,255,.98),0 0 18px rgba(227,132,150,.9),0 0 30px rgba(227,132,150,.55)}
  50%{opacity:1;text-shadow:0 0 12px #fff,0 0 24px #E38496,0 0 40px rgba(227,132,150,.75)}
}
.petal{position:absolute;top:-90px;display:grid;place-items:center;animation:fall linear forwards;z-index:5;cursor:pointer;will-change:transform}
.pi{display:block;width:var(--s);height:var(--s);pointer-events:none;animation:tumble var(--td) ease-in-out infinite alternate;opacity:var(--o,1)}
.pi img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.pi.fb{width:calc(var(--s)*.6);height:calc(var(--s)*.85);border-radius:70% 0 70% 0;background:var(--pink);box-shadow:0 0 10px rgba(227,132,150,.6)}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(var(--dx2),58dvh,0) rotate(calc(var(--spin)*.5))}100%{transform:translate3d(var(--dx),122dvh,0) rotate(var(--spin))}}
@keyframes tumble{from{transform:perspective(420px) scaleX(var(--fl)) rotate(var(--r0)) rotateX(0) rotateY(0) translateX(calc(var(--sw)*-1))}to{transform:perspective(420px) scaleX(var(--fl)) rotate(var(--r1)) rotateX(var(--rx)) rotateY(var(--ry)) translateX(var(--sw))}}

/* wedding details pop-up */
#pop{position:absolute;inset:0;z-index:40;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .5s}
#pop.show{opacity:1;pointer-events:auto}
#pop:not(.show) .maplink{pointer-events:none}
#pop .card{width:84%}
#pop .row{margin-top:.7rem;color:var(--forest);font-size:.95rem}
#pop .maplink{color:var(--pink)}
#popCard h2{font-size:4.1rem;line-height:1.05;overflow-wrap:anywhere}

/* ===== FINAL PAGE ===== */
#final{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.final-greeting,#final h1{font-family:var(--fd);font-weight:500;color:var(--pink);-webkit-text-stroke:.3px currentColor}
.final-greeting{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.2;margin-bottom:1.3rem}
#final h1{font-size:clamp(4.8rem,22vw,6.8rem);line-height:1.05;text-wrap:balance}
#final .lg{width:34%;margin-top:2rem;transition:transform .9s ease,opacity .9s ease}
.logo-return{position:fixed;z-index:200;object-fit:contain;pointer-events:none;transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
</style>
</head>
<body>
<div class="frame">
  <div id="logo">
    <div id="logoBox">
      <img id="logoImg" alt="Logo">
      <div class="mono" id="mono">A <span>∞</span> M<small>WEDDING</small></div>
    </div>
    <div id="hint"><span class="fx" style="--d:3s;display:inline-block">Draw <span class="inf">∞</span> to begin</span></div>
  </div>
  <div id="nameModal"><div class="card">
    <h2 class="welcome-word fx" style="--d:.3s">Welcome</h2><p class="fx l" style="--d:.5s">Please enter your name</p>
    <input class="fx r" style="--d:.7s" id="nameIn" placeholder="Your name" autocomplete="off" maxlength="40">
    <button class="btn fx" style="--d:.9s" id="enterBtn">Enter</button>
  </div></div>
  <div id="app"></div>
  <div id="pop"><div class="card" id="popCard"></div></div>
</div>
<canvas id="dust"></canvas>

<script>
/* ================= EDIT THIS SECTION ================= */
const CONFIG={
  couple:"Samidha & Rahil",
  logo:"assets/logo.png",
  ganpati:"assets/ganpati.png",
  tree:"assets/Ganpati%20Tree.png",   // SVG fallback is drawn if this file is missing
  hibiscus:"assets/hibiscus.png",
  petal:"assets/petal.png",
  drawTree:true,                      // false if the main BG already has a tree
  flowerPos:[[12,76],[48,62],[30,80]],// hibiscus positions on the tree (% left, % top)
  bg:{main:"assets/bg-main.jpg",puja:"assets/bg-puja.jpg",mehendi:"assets/bg-mehendi.jpg",sangeet:"assets/bg-sangeet.jpg",haldi:"assets/bg-haldi.jpg",wedding:"assets/bg-wedding.jpg"}
};
// Page order: Main → Puja → Mehendi → Sagai (sangeet) → Haldi → Wedding (petals) → Thank-you
const ORDER=["mehendi","sangeet","haldi","wedding"];
const EVENTS={
  puja:{title:"Grahamak & Mandap Mahurat",date:"wednesday, 09th december 2026",time:"9:00 AM onwards",venue:"Family Residence, Mumbai",map:""},
  mehendi:{title:"Mehendi te Vaavi",date:"thursday, 10th december 2026",time:"5:00 PM onwards",venue:"Family Residence, Mumbai",map:""},
  sangeet:{title:"Sagai & Shor Sharaba",date:"friday, 11th december 2026",time:"7:00 PM onwards",venue:"Embassy Hall, The Tunga Paradise, Andheri E, Mumbai",map:""},
  haldi:{title:"Prem Pithi",date:"saturday, 12th december 2026",time:"05:00 PM onwards",venue:"Family Residence, Mumbai",map:""},
  wedding:{title:"Mangal Pheras",date:"sunday, 13th december 2026",time:"Jaan Agaman: 10:30 AM<br>Hasta Melap: 12:30 PM",venue:"Grande Hall C, NESCO, Goregaon E, Mumbai",map:""}
};
// First name (lowercase) → events invited to. Wedding is always shown.
const GUESTS={
  "priya":["puja","mehendi","sangeet","haldi","wedding"],
  "rahul":["puja","sangeet","wedding"],
  "anita":["mehendi","haldi","wedding"]
};
const DEFAULT_GUEST=[];
/* ===================================================== */

const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a);
let stage='logo',cur=0,guest='',popOpen=false,locked=false,filled=false,scenes=[],PETAL=0,FINAL=0,ps=null,introTimer=null,introPromptShown=false;
let pts=[],drawing=false,down=null;
const app=$('#app'),li=$('#logoImg');

/* ---- pixie dust ---- */
const cv=$('#dust'),cx=cv.getContext('2d');
let P=[],dpr=Math.min(devicePixelRatio||1,2);
function rs(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
rs();addEventListener('resize',rs);
function dust(x,y,o={}){
  const n=o.n||3;
  for(let i=0;i<n;i++)P.push({x:x+rnd(-3,3),y:y+rnd(-3,3),vx:rnd(-.3,.3)*(o.spread||1),vy:rnd(-.35,.15)*(o.spread||1),l:0,m:o.tiny?rnd(55,120):rnd(40,85),s:o.tiny?rnd(.6,1.7):rnd(1.2,2.8),a:o.faint?.38:1,ph:rnd(0,6)});
}
const burst=(x,y,n=50,o={})=>dust(x,y,{...o,n,spread:o.spread||4});
(function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.l++;
    if(p.l>p.m){P.splice(i,1);continue}
    p.x+=p.vx;p.y+=p.vy+.04;p.vx*=.985;
    const t=p.l/p.m;
    cx.globalAlpha=Math.max(p.a*(t<.5?1:1-(t-.5)*1.7)*(.65+.35*Math.sin(p.l*.4+p.ph)),0);
    cx.fillStyle=t>.55?'#FFE9A8':'#E8B84A';cx.shadowColor='#E8B84A';cx.shadowBlur=t>.55?3:10;
    cx.beginPath();cx.arc(p.x,p.y,Math.max(p.s*(1-t*.6),.4),0,6.283);cx.fill();
  }
  cx.globalAlpha=1;requestAnimationFrame(loop);
})();

/* ---- load the logo directly; no opening logo animation ---- */
li.onload=()=>{
  li.style.opacity=1;
  li.style.display='block';
  $('#mono').style.display='none';
};
li.onerror=()=>{
  console.error('Logo failed to load:',li.src);
  li.style.display='none';
  $('#mono').style.display='block';
};
li.src=CONFIG.logo;

/* warm the cache while the guest is still on the logo screen */
setTimeout(()=>[CONFIG.ganpati,CONFIG.tree,CONFIG.hibiscus,CONFIG.petal,...Object.values(CONFIG.bg)].forEach(s=>{new Image().src=s}),400);

/* ---- infinity gesture ---- */
function isInfinity(){
  if(pts.length<25)return false;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),w=x1-x0,h=y1-y0;
  if(w<110||h<w*.18||h>w*.95)return false;
  const b=$('#logoBox').getBoundingClientRect(),mx=(x0+x1)/2,my=(y0+y1)/2;
  if(mx<b.left-70||mx>b.right+70||my<b.top-70||my>b.bottom+70)return false;
  let L=0,R=0;
  for(let i=1;i<pts.length-1;i++){
    const a={x:pts[i].x-pts[i-1].x,y:pts[i].y-pts[i-1].y},c={x:pts[i+1].x-pts[i].x,y:pts[i+1].y-pts[i].y};
    const ang=Math.atan2(a.x*c.y-a.y*c.x,a.x*c.x+a.y*c.y);
    if(pts[i].x<mx)L+=ang;else R+=ang;
  }
  return Math.abs(L)>2.2&&Math.abs(R)>2.2&&L*R<0;
}
function infinityDone(){
  stage='name';drawing=false;
  pts.forEach((p,i)=>{if(i%2==0)setTimeout(()=>dust(p.x,p.y,{n:3,spread:2}),i*6)});
  setTimeout(()=>{$('#nameModal').classList.add('show');$('#nameIn').focus({preventScroll:true})},950);
}

/* ---- builders ---- */
const FSVG=`<svg viewBox="-22 -22 44 44">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-9" rx="7.5" ry="11" fill="#E38496" stroke="#fff" stroke-width=".7" transform="rotate(${a})"/>`).join('')}<circle r="4.2" fill="#fff" opacity=".9"/><path d="M0 0L8-13" stroke="#B2AF87" stroke-width="1.3"/><circle cx="8" cy="-13" r="2" fill="#B2AF87"/></svg>`;
const hibImg=`<img src="${CONFIG.hibiscus}" draggable="false" alt="" onerror="this.outerHTML=FSVG">`;
const treeSVG=`<svg class="t" viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet"><g fill="none" stroke="#617764" stroke-linecap="round"><path d="M100 300C100 230 90 190 98 140 104 100 96 70 100 40" stroke-width="13"/><path d="M99 205C70 185 50 172 30 140" stroke-width="7"/><path d="M100 160C130 142 150 120 170 90" stroke-width="7"/><path d="M98 112C80 92 70 72 55 50" stroke-width="6"/></g><g fill="#1A3D28" opacity=".92"><circle cx="30" cy="135" r="22"/><circle cx="170" cy="85" r="24"/><circle cx="55" cy="45" r="22"/><circle cx="100" cy="30" r="26"/><circle cx="135" cy="125" r="18"/><circle cx="70" cy="160" r="18"/></g><g fill="#617764" opacity=".85"><circle cx="40" cy="125" r="14"/><circle cx="160" cy="75" r="15"/><circle cx="68" cy="38" r="13"/><circle cx="112" cy="22" r="14"/></g></svg>`;
const mapUrl=e=>e.map||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.venue);
const mapLink=(e,d)=>`<a class="maplink fx" style="--d:${d}s" href="${mapUrl(e)}" target="_blank" rel="noopener">Find on map ↗</a>`;
const hostLine=(e,cls,d)=>e.hosts?`<p class="${cls} host-names" style="--d:${d}s">Hosted by ${e.hosts}</p>`:'';

function evHTML(k,invited){
  if(k==='puja'&&!invited)return `<div class="tg fx" style="--d:.7s">With blessings</div><h2 class="fx l" style="--d:.9s">Ganpati Bappa Morya</h2>`;
  const e=EVENTS[k];
  return `<h2 class="fx l" style="--d:.9s">${e.title}</h2><p class="fx r date-time" style="--d:1.1s">${e.date}</p><p class="fx l date-time" style="--d:1.3s">${e.time}</p><p class="fx r venue-row" style="--d:1.5s">${e.venue}</p>${hostLine(e,'fx l',1.65)}${mapLink(e,1.8)}`;
}

function build(){
  app.innerHTML='';scenes=[];filled=false;locked=false;introPromptShown=false;
  clearTimeout(introTimer);introTimer=null;
  const inv=new Set(GUESTS[guest.toLowerCase().split(/\s+/)[0]]||DEFAULT_GUEST);
  const pages=['main','puja',...ORDER.filter(k=>inv.has(k)||k==='wedding')];
  PETAL=pages.length-1;FINAL=pages.length;

  pages.forEach((k,i)=>{
    const src=CONFIG.bg[k]||'';
    const s=document.createElement('div');
    s.className='scene';s.id='s'+i;s.dataset.event=k;
    s.innerHTML=`<div class="ph" hidden></div>`+(src?`<img class="bg" src="${src}" alt="" aria-hidden="true">`:'');
    const ph=s.querySelector('.ph'),bg=s.querySelector('img.bg');
    const fail=()=>{
      ph.hidden=false;
      ph.innerHTML=`Background image could not be loaded<br><small>Path: ${src||'none configured for '+k}</small>`+(bg?`<br><small>Resolved URL: ${bg.src}</small>`:'');
      if(bg)console.error('Background image failed:',{path:src,resolvedURL:bg.src});
    };
    if(!bg)fail();
    else{
      bg.addEventListener('load',()=>{ph.hidden=true});
      bg.addEventListener('error',fail);
      if(bg.complete&&bg.naturalWidth>0)ph.hidden=true;
    }

    if(k==='main')s.insertAdjacentHTML('beforeend',`<div class="intro fx" style="--d:.4s"><div class="eyebrow">A blessing before the celebrations</div><h1>With love, devotion &amp; new beginnings</h1><p class="intro-copy"><!-- introduction text goes here --></p></div><div id="hintG">Offer Bappa a flower</div><div id="drop" aria-label="Flower offering space"></div><div class="tree-art">${CONFIG.tree?`<img data-tree-image src="${CONFIG.tree}" alt="Wedding invitation tree">`:(CONFIG.drawTree?treeSVG:'')}${CONFIG.flowerPos.map(([l,t])=>`<div class="flower" style="left:${l}%;top:${t}%">${hibImg}</div>`).join('')}</div>`);
    else if(k==='wedding')s.insertAdjacentHTML('beforeend','<div class="petal-hint"><span class="hint-text">Catch a falling petal</span></div>');
    else s.insertAdjacentHTML('beforeend',`<div class="ev-over">${evHTML(k,inv.has(k))}</div><button class="next-cue" type="button" aria-label="Tap to continue"><span class="pixie-orbit"></span><span class="next-cue-label">Tap to continue</span></button>`);

    app.appendChild(s);scenes.push(s);
  });

  const fin=document.createElement('div');
  fin.className='scene';fin.id='final';
  const safeGuest=guest.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  fin.innerHTML=`<div class="final-greeting fx" style="--d:.3s">Dearest ${safeGuest},</div><h1><span class="fx l" style="--d:.8s;display:block">We look forward</span><span class="fx r" style="--d:1.1s;display:block">to seeing you</span></h1><img class="lg fx" style="--d:1.5s" src="${CONFIG.logo}" alt="Wedding logo" onerror="this.style.display='none'">`;
  app.appendChild(fin);scenes.push(fin);
  ps=scenes[PETAL];

  /* Ganpati + flower: one element that lives above the scenes */
  app.insertAdjacentHTML('beforeend',`<div id="bappa"><div class="image-fallback" hidden></div><img class="bgan" src="${CONFIG.ganpati}" draggable="false" alt="Ganpati Bappa"><div class="bappa-flower">${hibImg}</div></div>`);
  const gan=$('#bappa .bgan'),gf=$('#bappa .image-fallback');
  const ganFail=()=>{
    gf.hidden=false;
    gf.innerHTML=`Ganpati image could not be loaded<br><small>Path: ${CONFIG.ganpati}</small><br><small>Resolved URL: ${gan.src}</small>`;
    console.error('Ganpati image failed:',{path:CONFIG.ganpati,resolvedURL:gan.src});
  };
  gan.addEventListener('load',()=>{if(gan.naturalWidth>0)gf.hidden=true});
  gan.addEventListener('error',ganFail);
  if(gan.complete&&!gan.naturalWidth)ganFail();

  /* tree artwork: fall back to the drawn SVG if the file is missing */
  const tree=scenes[0].querySelector('[data-tree-image]');
  if(tree){
    const treeFail=()=>{
      const holder=tree.parentElement;
      if(!holder)return;
      tree.remove();
      if(CONFIG.drawTree)holder.insertAdjacentHTML('beforeend',treeSVG);
      console.warn('Tree image unavailable; using SVG fallback:',CONFIG.tree);
    };
    tree.addEventListener('error',treeFail);
    if(tree.complete&&!tree.naturalWidth)treeFail();
  }

  scenes[0].querySelectorAll('.flower').forEach(wireFlower);
  scenes.forEach((sc,idx)=>{
    const cue=sc.querySelector('.next-cue');
    if(cue)cue.addEventListener('pointerup',e=>{e.stopPropagation();go(idx+1)});
  });
}

/* ---- navigation ---- */
function show(i){
  cur=i;
  const bp=$('#bappa');
  bp.classList.toggle('up',i>=1);
  bp.classList.toggle('gone',i>=2);
  if(i===0)bp.classList.remove('offered');

  if(i===PETAL&&!filled){filled=true;for(let k=0;k<14;k++)makePetal(true)}

  clearTimeout(ps._hintTimer);
  if(i===PETAL){
    const hint=ps.querySelector('.petal-hint');
    hint.classList.remove('show');
    ps._hintTimer=setTimeout(()=>{if(cur===PETAL&&!popOpen)hint.classList.add('show')},2000);
  }

  scenes.forEach((s,j)=>{s.className='scene'+(j<i?' past':j==i?' active':'')+(j===PETAL&&popOpen?' dim':'')});

  if(i===0){
    const hint=$('#hintG');
    if(introPromptShown)hint.classList.add('show');
    else if(!introTimer)introTimer=setTimeout(()=>{
      if(cur===0){hint.classList.add('show');introPromptShown=true}
      introTimer=null;
    },5000);
  }else if(introTimer){clearTimeout(introTimer);introTimer=null}
}
function go(i){
  if(i<0||i>FINAL||popOpen)return;
  if(i===0){locked=false;scenes[0].querySelectorAll('.flower').forEach(f=>{f.style.transform='';f.style.opacity=1})}
  show(i);
}

/* ---- name entry ---- */
function submitName(){
  const v=$('#nameIn').value.trim(),firstName=v.toLowerCase().split(/\s+/)[0];
  if(!v||!Object.prototype.hasOwnProperty.call(GUESTS,firstName)){
    const c=$('#nameModal .card');
    c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
    let err=$('#guestError');
    if(!err){
      err=document.createElement('p');err.id='guestError';
      err.style.cssText='color:#B34D62;font-size:.85rem;margin-top:.8rem';
      $('#nameIn').insertAdjacentElement('afterend',err);
    }
    err.textContent=v?'We couldn’t find your invitation. Please check the name.':'Please enter your name.';
    return;
  }
  const err=$('#guestError');if(err)err.remove();
  guest=v;
  $('#nameIn').blur();
  build();
  $('#nameModal').classList.remove('show');$('#logo').classList.add('gone');
  stage='scenes';app.classList.add('on');show(0);$('#bappa').classList.add('in');
}
$('#enterBtn').onclick=submitName;
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitName()});
['pointerdown','pointerup'].forEach(ev=>$('#nameModal').addEventListener(ev,e=>e.stopPropagation()));

/* ---- flower drag (page 1) ---- */
function wireFlower(f){
  let sx,sy,tx=0,ty=0;
  const T=sc=>`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${sc})`;
  f.addEventListener('pointerdown',e=>{if(locked)return;e.stopPropagation();f.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;f.classList.add('drag')});
  f.addEventListener('pointermove',e=>{if(!f.classList.contains('drag'))return;tx=e.clientX-sx;ty=e.clientY-sy;f.style.transform=T(1.25);dust(e.clientX,e.clientY,{n:2,faint:true})});
  f.addEventListener('pointerup',e=>{
    e.stopPropagation();
    if(!f.classList.contains('drag'))return;
    f.classList.remove('drag');
    const d=$('#drop').getBoundingClientRect(),dx=d.left+d.width/2,dy=d.top+d.height/2;
    if(Math.hypot(e.clientX-dx,e.clientY-dy)<d.width*.8&&!locked){
      locked=true;
      const r=f.getBoundingClientRect();
      tx+=dx-(r.left+r.width/2);ty+=dy-(r.top+r.height/2);
      f.style.transform=T(1);
      burst(dx,dy,90,{spread:5});
      setTimeout(()=>{f.style.opacity=0;$('#bappa').classList.add('offered');go(1)},750);
    }else{tx=ty=0;f.style.transform=''}
  });
}

/* ---- petals (wedding page) ---- */
function makePetal(pre){
  const dur=rnd(9,17),sz=rnd(34,72),hit=Math.max(sz+40,84),p=document.createElement('div'),pi=document.createElement('span');
  p.className='petal';
  p.style.cssText=`width:${hit}px;height:${hit}px;left:calc(${rnd(-4,96)}% - ${hit/2}px);animation-duration:${dur}s;animation-delay:${pre?-rnd(0,dur*.9).toFixed(2):0}s;--dx:${rnd(-140,140)}px;--dx2:${rnd(-110,110)}px;--spin:${rnd(-540,540)}deg`;
  pi.className='pi';
  pi.style.cssText=`--s:${sz}px;--td:${rnd(2.4,5)}s;--sw:${rnd(8,30)}px;--r0:${rnd(-70,0)}deg;--r1:${rnd(0,70)}deg;--rx:${rnd(-75,75)}deg;--ry:${rnd(-75,75)}deg;--fl:${Math.random()<.5?-1:1};--o:${rnd(.82,1).toFixed(2)}`;
  const im=new Image();
  im.src=CONFIG.petal;im.draggable=false;im.alt='';
  im.onerror=()=>{im.remove();pi.classList.add('fb')};
  pi.appendChild(im);p.appendChild(pi);
  p.addEventListener('animationend',e=>{if(e.target===p)p.remove()});
  p.addEventListener('pointerdown',e=>e.stopPropagation());
  p.addEventListener('pointerup',e=>{
    e.stopPropagation();
    const r=p.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,22,{spread:2.5});
    p.remove();openPop();
  });
  ps.appendChild(p);
}
function spawnPetal(){
  if(ps&&cur===PETAL&&!popOpen&&ps.querySelectorAll('.petal').length<20)makePetal(false);
  setTimeout(spawnPetal,rnd(450,1000));
}
spawnPetal();

function openPop(){
  /* a falling petal always reveals the wedding details */
  const e=EVENTS.wedding,row=(cls,v)=>v?`<div class="row ${cls}">${v}</div>`:'';
  $('#popCard').innerHTML=`<h2 class="fx" style="--d:.1s">${e.title}</h2>${row('date-time fx l',e.date)}${row('date-time fx r',e.time)}${row('venue-row fx l',e.venue)}${row('host-names fx r',e.hosts&&'Hosted by '+e.hosts)}${mapLink(e,1.1)}`;
  popOpen=true;$('#pop').classList.add('show');ps.classList.add('dim');
}
function closePop(){popOpen=false;$('#pop').classList.remove('show');if(ps)ps.classList.remove('dim')}

/* ---- last page → logo: the small logo grows and glides to the centre ---- */
function returnToInfinity(){
  const fl=$('#final .lg'),logo=$('#logo'),box=$('#logoBox'),hint=$('#hint'),fin=$('#final');
  if(!fl||fl.style.display==='none'){logo.classList.remove('gone');app.classList.remove('on');stage='logo';cur=0;drawing=false;pts=[];return}
  stage='returning';
  const start=fl.getBoundingClientRect(),clone=fl.cloneNode(true);
  clone.className='logo-return';
  clone.style.cssText=`left:${start.left}px;top:${start.top}px;width:${start.width}px;height:${start.height}px;opacity:1`;
  document.body.appendChild(clone);
  fl.style.visibility='hidden';box.style.visibility='hidden';hint.style.visibility='hidden';
  fin.style.transition='opacity .6s';fin.style.opacity='0';
  logo.classList.remove('gone');
  const target=box.getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    clone.style.left=target.left+'px';clone.style.top=target.top+'px';
    clone.style.width=target.width+'px';clone.style.height=target.height+'px';
  }));
  setTimeout(()=>{
    box.style.visibility='';hint.style.visibility='';
    clone.remove();
    app.classList.remove('on');
    $('#nameModal').classList.remove('show');
    stage='logo';cur=0;drawing=false;pts=[];
  },1000);
}

/* ---- global pointer handling ---- */
addEventListener('pointerdown',e=>{
  down={x:e.clientX,y:e.clientY};
  if(stage==='logo'){drawing=true;pts=[{x:e.clientX,y:e.clientY}];dust(e.clientX,e.clientY,{n:4,tiny:true})}
});
addEventListener('pointermove',e=>{
  if(stage==='logo'&&drawing){
    const l=pts[pts.length-1];
    if(Math.hypot(e.clientX-l.x,e.clientY-l.y)>=6){
      pts.push({x:e.clientX,y:e.clientY});
      if(pts.length%6===0&&isInfinity()){infinityDone();return}
    }
    dust(e.clientX,e.clientY,{n:2,tiny:true,spread:.6});
  }else if(stage==='scenes'&&(e.buttons||e.pointerType==='mouse')&&!e.target.closest('.flower'))dust(e.clientX,e.clientY,{n:1,faint:true,spread:.7});
});
addEventListener('pointerup',e=>{
  if(stage==='logo'){drawing=false;burst(e.clientX,e.clientY,10,{tiny:true,spread:1.5});if(isInfinity())infinityDone();pts=[];return}
  if(stage!=='scenes'||!down)return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
  if(moved>12||e.target.closest('.flower,.petal,#nameModal,a'))return;

  if(popOpen){closePop();go(FINAL);return}

  const r=$('.frame').getBoundingClientRect(),tapX=(e.clientX-r.left)/r.width;

  if(cur===FINAL&&tapX>=.75){returnToInfinity();return}   /* last page: right side → logo */

  if(tapX<.25){dust(e.clientX,e.clientY,{n:16,faint:true,spread:2.5});go(cur-1);return}   /* left edge: back */

  if(cur===PETAL){   /* petal page: a tap pulses the prompt text */
    const hint=ps.querySelector('.petal-hint');
    if(hint.classList.contains('show')){
      const t=hint.firstElementChild;
      t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse');
    }
    return;
  }

  if(cur>=1&&cur<PETAL)go(cur+1);   /* event pages: advance */
});
</script>
</body>
</html>
